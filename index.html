<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своя ГИС · живой прототип · Москва</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --violet:#6C6CF0; --violet-btn:#5555DD; --violet-d:#4B4BC8; --lime:#D7F26B;
  --ink:#1A1640; --ink2:#4A4670; --muted:#6B6787; --bg:#F3F2EE; --line:#E1DED6;
  --metro3:#2E6FE6;
  --s1:0 1px 2px rgba(20,17,58,.06),0 4px 14px rgba(20,17,58,.07);
  --s2:0 4px 10px rgba(20,17,58,.18),0 16px 36px rgba(20,17,58,.22);
  --s3:0 -4px 12px rgba(20,17,58,.12),0 -16px 40px rgba(20,17,58,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}   /* атрибут hidden сильнее классов вроде .pill{display:inline-flex} */
.sheet.tight .body{padding-bottom:20px;-webkit-mask-image:none;mask-image:none}   /* шторка по содержимому — без запаса и затухания снизу */
html,body{margin:0;height:100%;background:#E9E7F7;font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
button{font-family:inherit}
:focus-visible{outline:3px solid #F2A93B;outline-offset:2px}
/* заголовок экрана и карточка ведения получают фокус программно (для экранной читалки) — рамку им не рисуем */
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--violet);box-shadow:0 30px 80px rgba(40,30,120,.35),0 0 0 10px #15123a}
@media (max-width:500px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
#map{position:absolute;inset:0}
/* подпись авторов карты — всегда видна */
.attrib{position:absolute;left:16px;top:98px;z-index:19;font-size:10.5px;color:#fff;background:rgba(26,22,64,.55);padding:3px 8px;border-radius:8px;transition:top .3s,bottom .3s}
.attrib a{color:#fff}
.attrib.guiding{top:auto;bottom:178px}
.status{position:absolute;top:0;left:0;right:0;height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;color:#fff;z-index:30;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.topbar{position:absolute;top:44px;left:14px;right:14px;display:flex;gap:8px;z-index:20;transition:opacity .25s,transform .25s}
.topbar.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
.topbar{flex-wrap:wrap}
.topbar .brk{flex-basis:100%;height:0}
.search .ph{color:var(--muted)}
.wchip{height:40px;border-radius:20px;border:0;background:#fff;box-shadow:var(--s2);padding:0 14px;font:inherit;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.attrib.low{top:150px}
/* путь: поиск → место → способы */
.q{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:#fff;padding:0 16px;font:inherit;font-size:15px;color:var(--ink);outline:none}
.q:focus,.q:focus-visible{outline:none;border:2px solid var(--violet-btn);padding:0 15px}   /* поле ввода в фокусе — фиолетовая рамка, без оранжевого кольца */
.sec{font-size:13px;color:var(--muted);margin:10px 2px 8px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:56px}
.lrow.muted{background:#FBFAF7}.lrow.muted b{color:var(--ink2)}
.lrow .ico{width:40px;height:40px}
.lrow .tx{flex:1;min-width:0}.lrow .tx b{display:block;font-weight:600;font-size:15px}.lrow .r{text-align:right;flex:none}
.lrow .r .m{font-size:12px}.lrow .r b{color:var(--violet-d);font-size:15px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.quick span{height:36px;border-radius:18px;background:#fff;border:1px solid var(--line);padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btns{display:flex;gap:8px}.btns .btn{flex:1}.btns .btn.w{flex:none;width:auto;padding:0 20px}
.tripbar{display:flex;gap:8px;margin:6px 0 14px}
.tripbar button{height:40px;border-radius:20px;font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.tripbar .from{flex:1;display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);padding:0 4px}.tripbar .from i{width:10px;height:10px;border-radius:5px;background:var(--violet-btn);display:inline-block}
.tripbar .when{border:0;background:#EDEDFD;color:var(--violet-d);font-weight:600}
.tripbar .when.on{background:var(--violet-btn);color:#fff}
.savebtn{border:0;background:none;color:var(--violet-d);font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;padding:0 2px}
.gobar{position:sticky;bottom:0;padding:14px 0 6px;margin-top:4px;background:linear-gradient(rgba(243,242,238,0),var(--bg) 24%);z-index:2}   /* «Поехали» всегда видна */
.sheet.nomask .body{-webkit-mask-image:none;mask-image:none;padding-bottom:16px}
.offer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.search{flex:1;height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--s2);font-size:14px;color:var(--ink2);border:0;text-align:left;cursor:pointer}
.search b{color:var(--ink);font-weight:600}
.round{width:48px;height:48px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:var(--s2);border:0;cursor:pointer;color:var(--ink);font-size:18px}
.press{transition:transform .12s ease,box-shadow .12s ease,background .12s}
.press:active{transform:scale(.96);box-shadow:0 1px 3px rgba(20,17,58,.18)!important}
/* шторка */
.sheet{position:absolute;left:0;right:0;bottom:0;height:56%;overflow:hidden;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--s3);z-index:25;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet.anim{transition:height .35s cubic-bezier(.2,.8,.2,1)}
.grab{border:0;background:none;padding:12px 0 6px;display:flex;justify-content:center;cursor:grab;width:100%}
.grab i{width:44px;height:5px;border-radius:3px;background:#8F8BA6}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 40px;touch-action:pan-y;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent)}
.body::-webkit-scrollbar{display:none}
.view.in{animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.view.back{animation:vback .28s ease}
@keyframes vback{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
h1{font-size:20px;font-weight:600;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink);cursor:pointer}
.chip.sel{background:#D7F26B;border-color:#D7F26B;color:#2B3A00;font-weight:600}   /* выбранный вариант ответа — лайм */
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:#E7E5F3;border-radius:14px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;height:42px;border:0;border-radius:11px;background:transparent;font-size:14px;color:var(--ink2);cursor:pointer;font-weight:500;transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--s1)}
.tbtn{display:inline-flex;align-items:center;gap:4px;font:inherit;font-weight:600;color:var(--violet-d);background:#EDEDFD;border:0;border-radius:12px;padding:0 12px;min-height:44px;cursor:pointer;vertical-align:middle}
.tbtn span{font-size:13px}
.seg.sm{margin:0 0 8px}.seg.sm button{height:36px;font-size:13px}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px;margin:14px 0}
.wheel .col{height:220px;width:90px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;box-sizing:border-box;touch-action:pan-y;overscroll-behavior:contain;border-radius:12px}
.wheel .col:focus-visible{outline-offset:-3px}
.wheel::before,.wheel::after{content:'';position:absolute;left:0;right:0;height:70px;pointer-events:none;z-index:1}
.wheel::before{top:0;background:linear-gradient(var(--bg),rgba(243,242,238,0))}
.wheel::after{bottom:0;background:linear-gradient(rgba(243,242,238,0),var(--bg))}
.wheel .col::-webkit-scrollbar{display:none}
.wheel .it{height:44px;line-height:44px;text-align:center;font-size:26px;font-weight:600;scroll-snap-align:center;cursor:pointer;color:var(--ink)}
.wheel .colon{font-size:26px;font-weight:600}
.wheel .lens{position:absolute;left:50%;top:50%;width:220px;height:48px;margin:-24px 0 0 -110px;border-radius:14px;background:rgba(85,85,221,.10);pointer-events:none}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--s1);cursor:pointer;position:relative;border:2px solid transparent;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.card.sel{border-color:var(--violet)}
.card.late{background:#F6F5F9;box-shadow:none}
.card.late .win{display:flex}
.card .top{display:flex;align-items:center;gap:12px}
svg.i{display:block;flex:none}
/* «Ты на месте»: флажок на лаймовом круге и три конфетти из палитры */
.done-art{position:relative;height:64px;width:120px;margin:6px 0 4px}
.done-art .flag{position:absolute;left:0;top:4px;width:56px;height:56px;border-radius:28px;background:#D7F26B;color:#2B3A00;display:grid;place-items:center}
.done-art i{position:absolute;width:10px;height:10px;border-radius:5px}
.done-art .c1{left:64px;top:6px;background:#ECEBFB}.done-art .c2{left:78px;top:30px;width:7px;height:7px;background:#FFB27A}.done-art .c3{left:62px;top:46px;width:6px;height:6px;background:#6C6CF0}
.search svg.i,.wchip svg.i,.savebtn svg.i,.tripbar svg.i{display:inline-block;vertical-align:middle}
.savebtn{display:inline-flex;align-items:center;gap:6px}
.lm svg.i,.lmk svg.i{display:inline-block;vertical-align:-3px}
.st .dot svg.i{color:var(--ink)}.st.metro .dot svg.i{color:#fff}
.poi .e{color:#4B4BC8}
.round svg.i{color:var(--ink)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:#ECEBFB;color:#4B4BC8}
.t{font-size:16px;font-weight:600}
.m{font-size:13px;color:var(--muted)}
.right{margin-left:auto;text-align:right;flex:none}
.big{font-size:18px;font-weight:600;white-space:nowrap}
.win{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
/* Итоги — как в Фигме: лайм — надёжно, оранжевый — риск, розовый — опоздание, лаванда — нейтральное */
.pill{min-height:26px;padding:3px 10px;border-radius:13px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;background:#ECEBFB;color:#4B4BC8;font-weight:500}
.pill.g{background:#D7F26B;color:#2B3A00}.pill.a{background:#FFB27A;color:#5A2A00}.pill.r{background:#F6C1D6;color:#6B1236}
.pill.v{background:#ECEBFB;color:#4B4BC8}
.rel{display:inline-flex;gap:2px;margin-left:2px}.rel i{width:5px;height:10px;border-radius:2px;background:#CFCCDD}.rel i.f{background:currentColor}
.note{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.btn{height:52px;border-radius:26px;border:0;font-size:16px;font-weight:600;cursor:pointer;width:100%;box-shadow:0 2px 4px rgba(20,17,58,.18),0 6px 14px rgba(20,17,58,.14)}
/* Кнопки как в Фигме: главная — плоская чернильная, вторичная — белая с рамкой, без тяжёлых теней */
.btn.p,.btn.d{background:var(--ink);color:#fff;box-shadow:var(--s1)}
.btn.w{background:#fff;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.back-btn{border:0;background:#fff;font-size:20px;color:var(--ink);cursor:pointer;width:44px;height:44px;border-radius:14px;box-shadow:var(--s1);flex:none;display:grid;place-items:center;margin-right:4px}
.steps{position:relative;margin:8px 0 14px}
.st{display:flex;gap:12px;padding:8px 0;position:relative}
.st .dot{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:14px;flex:none;z-index:1;background:#fff;box-shadow:var(--s1)}
.st:not(:last-child)::after{content:"";position:absolute;left:14px;top:38px;bottom:-8px;width:2px;background:#DAD8E8}
.st.metro:not(:last-child)::after{background:var(--metro3)}
.st .tx{flex:1}
.st .tx b{font-weight:600;font-size:15px}
.lm{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#FFFFFF;border:1px solid #E4E2F0;color:#4A4670;border-radius:10px;padding:5px 9px;font-size:12.5px}
.lm.w{background:#FFB27A;border-color:#FFB27A;color:var(--ink)}   /* предупреждение: тот же оранжевый, что у «есть риск» */
.pois{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.poi{flex:none;width:170px;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--s1);cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.poi .e{font-size:22px}.poi b{display:block;font-size:14px;margin-top:6px}.poi span{font-size:12px;color:var(--muted)}
.toggle{width:46px;height:28px;border-radius:14px;background:#8A86A3;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle.on{background:var(--violet-btn)}.toggle.on::after{left:21px}
.banner{background:var(--violet-btn);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--s1)}
.banner b{font-size:16px}
.banner.late{background:#F6C1D6;color:#4A0E27;box-shadow:none;border:0}
.banner.late .chip{height:40px}
.hint{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:2px 0 10px;font-size:13px;color:var(--ink2)}
.hint>span:nth-child(2){flex:1}
.mlink{border:0;background:none;color:var(--violet-d);font:inherit;font-weight:600;cursor:pointer;min-height:44px;padding:0 4px}
.best{display:inline-block;margin-bottom:8px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:8px}
.card .right .m{font-size:12px}
/* ведение */
.guide{position:absolute;inset:0;z-index:26;pointer-events:none;display:none}
.guide.on{display:block}
.gtop{position:absolute;top:44px;left:12px;right:12px;background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--s2);pointer-events:auto;transition:background .3s}
.gtop .k{font-size:12.5px;opacity:.8}
.gtop .h{font-size:21px;font-weight:600;margin-top:2px;line-height:1.2}
.gtop .lmk{margin-top:8px;font-size:13px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;display:inline-block}
.gtop.alert{background:var(--violet-d)}
.stations{display:flex;gap:4px;margin-top:10px}
.stations i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.stations i.f{background:var(--lime)}
.gbot{position:absolute;left:12px;right:12px;bottom:18px;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--s3);pointer-events:auto}
.gbot .row{justify-content:space-between}
.eta{font-size:22px;font-weight:600}
.speed{border:1px solid var(--line);background:#fff;border-radius:20px;height:40px;padding:0 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.me{width:22px;height:22px;border-radius:11px;background:#fff;border:5px solid var(--ink);box-shadow:0 0 0 8px rgba(215,242,107,.45),0 4px 10px rgba(0,0,0,.35)}
.pin{width:max-content;background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:14px;box-shadow:0 2px 4px rgba(20,17,58,.3),0 6px 12px rgba(20,17,58,.18);white-space:nowrap}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.pin.dark{background:var(--ink);color:#fff}.pin.dark::after{border-top-color:var(--ink)}
.pin.m3{background:var(--metro3);color:#fff}.pin.m3::after{border-top-color:var(--metro3)}
.pin.poi-pin{background:var(--lime);color:var(--ink)}.pin.poi-pin::after{border-top-color:var(--lime)}
.st-dot{width:12px;height:12px;border-radius:6px;background:#fff;border:3px solid var(--metro3)}
.tip{background:var(--ink);color:#fff;font-size:13px;padding:8px 11px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:200px;width:max-content}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(26,22,64,.94);color:#fff;border-radius:18px;padding:16px 20px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:all .25s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px;font-size:14px;z-index:5;
  background:repeating-linear-gradient(8deg,transparent 0 118px,rgba(200,240,106,.28) 118px 121px),repeating-linear-gradient(96deg,transparent 0 96px,rgba(200,240,106,.28) 96px 99px),var(--violet)}
.fallback span{background:rgba(26,22,64,.45);padding:8px 14px;border-radius:14px;margin-top:-180px}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="map" aria-label="Карта Москвы"></div>
  <div class="fallback" id="fallback"><span>Карта появится, когда будет интернет</span></div>
  <div class="status" aria-hidden="true"><span id="clock">8:20</span><span>● ● ▮</span></div>
  <div class="attrib" id="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> · маршруты OSRM</div>

  <div class="topbar" id="topbar"></div>

  <div class="sheet anim" id="sheet">
    <button class="grab" id="grab" aria-label="Развернуть или свернуть панель"><i></i></button>
    <div class="body" id="body"></div>
  </div>

  <div class="guide" id="guide">
    <div class="gtop" id="gtop" tabindex="-1" aria-live="off"></div>
    <div class="gbot">
      <div class="row">
        <div><div class="eta" id="geta">8:46</div><div class="m" id="gleft">ещё 26 мин</div></div>
        <button class="speed press" id="speedBtn" onclick="toggleSpeed()" aria-label="Ускорить демонстрацию">Демо: ×1</button>
      </div>
      <div id="ggoal" class="pill" hidden style="margin-top:8px"></div>
      <div style="height:12px"></div>
      <button class="btn w press" id="stopBtn" onclick="endTrip()">Завершить поездку</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ===== КОНТЕКСТ ПОЕЗДКИ =====
   Одно время для всего: каждый модуль (способ передвижения или подсказки) готовит свои данные на время T.
   T — опорное время поездки ≈ выход + 12 мин. В режиме «Прибыть к» выход зависит от прогноза,
   а прогноз — от T: уточняем 2–3 раза. */
const TRIP_ANCHOR = 12;
// Общие дорожные данные ядра: пробки по времени суток (ими пользуются модули такси и каршеринга)
const TRAFFIC = {
  morning: { lo:22, hi:36, lm:'Утренние пробки: возможна задержка', warn:true,  tail:[0.10,5,15] },
  evening: { lo:22, hi:36, lm:'Вечерние пробки: возможна задержка', warn:true,  tail:[0.10,5,15] },
  day:     { lo:18, hi:28, lm:'Днём дороги свободнее',               warn:false, tail:[0.06,3,10] },
  late:    { lo:15, hi:22, lm:'Вечером дороги почти свободны',       warn:false, tail:[0.04,2,8] },
  night:   { lo:13, hi:18, lm:'Ночью дороги свободны',               warn:false, tail:[0.02,2,6] } };
const trafficAt = m => { m = ((Math.round(m) % DAY) + DAY) % DAY;
  return m >= 420 && m < 600 ? 'morning' : m >= 1020 && m < 1200 ? 'evening' : m >= 600 && m < 1020 ? 'day' : m >= 1200 && m < 1380 ? 'late' : 'night'; };
const CTX = { T: null, key: null, traffic: 'morning', mods: {} };
function setCtx(T){
  const tr = trafficAt(T);
  // Факты модулей на время поездки; каждый модуль — в своей «песочнице»
  const mods = {}, parts = [];
  for(const m of activeModules()){ let f = {};
    if(typeof m.context === 'function'){ try{ f = m.context(T) || {}; JSON.stringify(f); }catch(e){ broke(m, 'context', e); continue; } }
    mods[m.id] = f; parts.push(m.id + ':' + JSON.stringify(f)); }
  CTX.T = T; CTX.traffic = tr; CTX.mods = mods;
  const key = tr + '|' + parts.join(';'); if(CTX.key === key) return;   // включённые модули и их факты — в ключе: изменились — пересчёт
  CTX.key = key;
  for(const x in FC) delete FC[x];
  // способы передвижения готовят свои варианты (интервалы, пробки…) на это время
  for(const m of activeModules()) if(typeof m.prepare === 'function'){ try{ m.prepare(T, mods[m.id] || {}); }catch(e){ broke(m, 'prepare', e); } }
  for(const k in OPTIONS){ const bad = optionProblem(k, OPTIONS[k]); if(bad){ const m = MODULES.find(x => x.options && x.options[k]); if(m) broke(m, 'prepare', { message: bad }); delete OPTIONS[k]; } }
}
// Контекст для текущего выбора времени. Кэш по ключу выбора — считаем один раз на изменение.
let SYNC_KEY = null;
function syncCtx(){
  const key = [state.mode, state.timeMode, state.arrive, state.depart, JSON.stringify(state.modules), MODULES.map(m=>m.id + (m.__broken?'!':'')).join(',')].join('|');
  if(key === SYNC_KEY) return; SYNC_KEY = key;
  rebuildOptions();
  if(!arriveMode()){ setCtx(dep() + TRIP_ANCHOR); return; }
  let T = state.arrive - 25;
  for(let i = 0; i < 3; i++){
    setCtx(T);
    const ks = goKeys().filter(k => !OPTIONS[k].closed && !OPTIONS[k].noTarget); if(!ks.length) break;
    const L = state.arrive - Math.min(...ks.map(k => simulate(k).p95));   // по самому быстрому из доступных способов
    const nT = (L >= NOW + 1 ? L : NOW) + TRIP_ANCHOR;
    if(Math.abs(nT - T) < 1) break; T = nT;
  }
}

// Варианты маршрута дают модули-способы (см. МОДУЛИ). Ядро собирает их здесь и ничего не знает о конкретных способах.
// Вариант: name, ico, bg, fg, price, detail, legs, tail, pois; purpose — 'go' (добраться) или 'walk' (погулять); order;
// verb («Выходи»/«Вызывай»), cta (кнопка), confirm (подтверждение перед оплатой), startToast, riskWord, varyWord, delayWhy, legIco;
// requires — другие способы, без которых вариант не нужен; closed/closedInfo — способ сейчас не работает (ставит модуль).
// Каждый шаг — диапазон lo–hi минут. Прогноз = сумма шагов, считается симуляцией (см. forecast).
const OPTIONS = {};
const isOn = id => activeModules().some(m => m.id === id);
// Шлюз для вариантов способов: ключ, форма шагов, цвета; текст без разметки. Плохой вариант — модуль отключается.
const LEG_TYPES = ['walk', 'metro', 'car', 'wait'], HEX = /^#[0-9a-f]{3,8}$/i;
function optionProblem(k, o){
  if(!/^[a-z][a-z0-9_-]*$/.test(k)) return 'ключ «' + k + '»';
  if(!o || typeof o.name !== 'string' || !['go','walk'].includes(o.purpose)) return 'нет name или purpose';
  if(!Array.isArray(o.legs) || !o.legs.length) return 'нет шагов';
  for(const l of o.legs){
    if(!l || !LEG_TYPES.includes(l.type)) return 'шаг неизвестного типа';
    if(![l.lo, l.hi].every(Number.isFinite) || l.hi < l.lo) return 'у шага нет времени';
    if(l.model === 'board' && l.plo != null && ![l.plo, l.phi, l.iv].every(Number.isFinite)) return 'у посадки нет интервала';
    if(!l.geom && !l.stations && !l.at && !(l.from && l.to)) return 'у шага нет места на карте'; }
  if(/[<>]|\\"/.test(JSON.stringify(o))) return 'разметка в тексте';
  return null;
}
function rebuildOptions(){
  for(const k in OPTIONS) delete OPTIONS[k];
  for(const m of activeModules()) if(m.options) for(const [k, o] of Object.entries(m.options)){
    if(!(o.requires || []).every(isOn)) continue;
    if(OPTIONS[k]){ console.warn('вариант «' + k + '» уже есть у другого модуля — ' + m.id + ' пропущен'); continue; }
    const bad = optionProblem(k, o); if(bad){ broke(m, 'options', { message: bad }); continue; }
    if(!Array.isArray(o.tail)) o.tail = [0, 0, 0];
    if(!HEX.test(o.bg || '')) o.bg = '#ECEBFB'; if(!HEX.test(o.fg || '')) o.fg = '#4B4BC8';
    OPTIONS[k] = o; }
  // выбранный способ не подменяем: если он пропал, экраны сами скажут об этом (lostMode)
}
// Способ, на котором стоял человек, выключили: честно сказать и вернуть к способам
function lostMode(){
  toast('Этот способ выключен — выбери другой');
  while(state.history.length && ['route','confirm','compare'].includes(state.history[state.history.length-1])) state.history.pop();
  state.view = 'compare'; state.sel = null; }
const keysFor = purpose => Object.keys(OPTIONS).filter(k => OPTIONS[k].purpose === purpose).sort((a,b) => (OPTIONS[a].order||9) - (OPTIONS[b].order||9));
const goKeys = () => keysFor('go'), walkKeys = () => keysFor('walk');

/* ================= МОДУЛИ =================
   Модуль — самостоятельный объект. Ядро о модулях ничего не знает: оно спрашивает включённые модули
   в четырёх точках встраивания и показывает ответы в своём стиле. Модуль отдаёт данные, не HTML.
   Добавить модуль = описать объект и вызвать registerModule(). Убрать = удалить объект (или выключить).

   Описание:      id (латиница), icon, name, desc, where, on (включён по умолчанию),
                  group: 'mode' — способ передвижения (даёт options — варианты маршрута, и prepare(T, f) — готовит их на время T),
                  requires: ['metro'] — работает, только если включены эти модули
   Свои данные:   context(T)            → факты на время поездки T (минуты суток), кладутся в CTX.mods[id]
   1. Прогноз:    legFactor(leg, f)      → множитель времени шага (1 — без изменений; ограничен 0,5–3)
   2. Шаги:       stepHints(leg, t, f)   → [{icon, text, warn}] — плашки у шага маршрута (t — время начала шага)
   3. Способы:    banners(f)             → [{icon, title, text}] — подсказки на экране способов
                  cardPills(k, f)        → ['текст'] — пилюли в карточке способа k
   4. Карта:      pois(k, f)             → [{e, n, d, at, extra}] — точки «По пути» и метки на карте
   leg — копия шага: type, label, station (вход/выход метро), stations (поездка), k (способ: metro, taxi…).
   f — факты этого модуля из context() (или {}), всегда последний аргумент.
   Шлюз: ответы проверяются, текст экранируется, лишнее отбрасывается; модуль с ошибкой отключается до конца сеанса.
   Модуль может сам попросить пересчёт: refreshModules(). Убрать модуль на ходу: unregisterModule(id). */
const MODULES = [];
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Регистрация: тот же id — замена, а не второй экземпляр
function registerModule(m){
  if(!m || !/^[a-z][a-z0-9_-]*$/.test(m.id || '')){ console.warn('модуль без корректного id — пропущен'); return; }
  const i = MODULES.findIndex(x => x.id === m.id); if(i >= 0) MODULES[i] = m; else MODULES.push(m);
  if(!(m.id in state.modules)) state.modules[m.id] = !!m.on;
  refreshModules(); }
function unregisterModule(id){ const i = MODULES.findIndex(x => x.id === id); if(i >= 0) MODULES.splice(i, 1); delete state.modules[id]; refreshModules(); }
// Модуль может сам попросить пересчёт (пришла свежая погода и т.п.)
var APP_READY = false;   // до первого экрана модули только регистрируются
function refreshModules(){ SYNC_KEY = null; CTX.key = null; if(FC) for(const x in FC) delete FC[x]; if(APP_READY) render(); }
const usable = m => m && state.modules[m.id] && !m.__broken;
// включён, не сломан и включены модули, без которых он не нужен (requires)
const activeModules = () => MODULES.filter(m => usable(m) && (m.requires || []).every(id => usable(MODULES.find(x => x.id === id))));
const facts = m => (CTX.mods && CTX.mods[m.id]) || {};
// Ошибка модуля: отключаем его до конца сеанса, остальное приложение работает
function broke(m, hook, e){ if(m.__broken) return; m.__broken = true; console.warn('модуль ' + m.id + ' отключён: ошибка в ' + hook + ' — ' + (e && e.message));
  SYNC_KEY = null; CTX.key = null; }
function call(m, hook, args){ try{ return m[hook](...args, facts(m)); }catch(e){ broke(m, hook, e); return undefined; } }
// Шлюз: ответы модулей проверяются и приводятся к ожидаемому виду; текст экранируется при выводе (esc)
const SHAPE = {
  banners:   x => x && x.title ? { icon: String(x.icon || '•'), title: String(x.title), text: String(x.text || '') } : null,
  stepHints: x => x && x.text ? { icon: String(x.icon || '•'), text: String(x.text), warn: !!x.warn } : null,
  cardPills: x => typeof x === 'string' && x ? x : null,
  pois:      x => x && x.n && Array.isArray(x.at) && x.at.length === 2 && x.at.every(Number.isFinite) ? { e: String(x.e || 'Пин'), n: String(x.n), d: String(x.d || ''), at: x.at, extra: String(x.extra || '') } : null };
const LIMIT = { banners: 2, stepHints: 2, cardPills: 2, pois: 6 };   // модули не могут завалить экран
function collect(hook, ...args){ const out = [];
  for(const m of activeModules()) if(typeof m[hook] === 'function'){
    const r = call(m, hook, args); if(!Array.isArray(r)) continue;
    for(const x of r){ const v = SHAPE[hook](x); if(v) out.push(v); } }
  return out.slice(0, LIMIT[hook]); }
// Прогноз: множитель шага от всех модулей; только числа 0,5–3
function legFactor(l){ let k = 1;
  for(const m of activeModules()) if(typeof m.legFactor === 'function'){ const v = Number(call(m, 'legFactor', [l])); if(Number.isFinite(v) && v > 0) k *= v; }
  return Math.min(3, Math.max(0.5, k)); }
// Шаг для модуля — копия с ключом способа k: модуль не может испортить данные маршрута
const legView = (k, l) => Object.freeze(Object.assign({ k }, l));

/* ================= ПРОГНОЗ =================
   Модель (проверка 2, 22.11):
   • поездка = шаги-диапазоны lo–hi; шаги связаны общим «характером дня» (если с утра всё медленно — медленно везде);
   • редкие сбои (tail) — с вероятностью и добавкой в минутах;
   • дождь замедляет пешие участки на RAIN;
   • из 4000 поездок берём настоящую медиану (обычное время) и 95-й процентиль («самое позднее» — так в 19 поездках из 20);
   • минуты шагов масштабируются, чтобы их сумма = медиане: что на экране складывается, то и в итоге. */
function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const triQ = (u, lo, hi) => { const c = 0.35; return u < c ? lo + Math.sqrt(u*c)*(hi-lo) : hi - Math.sqrt((1-u)*(1-c))*(hi-lo); };
const legK = l => legFactor(l);   // модули (погода и др.) меняют время шага
var FC = {};
function forecast(k){ syncCtx(); return simulate(k); }
function simulate(k){
  if(FC[k]) return FC[k];
  const o = OPTIONS[k], r = rng(k.length*7919 + k.charCodeAt(0)), N = 4000, s = new Float64Array(N);
  const K = o.legs.map(l => legK(legView(k, l)));       // множители модулей — один раз на шаг, а не 4000 раз
  for(let i=0;i<N;i++){
    const day = r(); let t = 0;                       // общий для всех шагов «характер дня»
    for(let j = 0; j < o.legs.length; j++){ const l = o.legs[j], u = 0.5*day + 0.5*r();
      if(l.model === 'board' && l.plo != null){ t += (triQ(u, l.plo, l.phi) + r()*l.iv + (r() < l.skip ? l.iv : 0)) * K[j]; continue; }   // ожидание — равномерно от 0 до интервала; в пик иногда пропускаешь полный поезд
      t += triQ(u, l.lo, l.hi) * K[j]; }
    if(o.tail[0] && r() < o.tail[0]) t += o.tail[1] + r()*(o.tail[2]-o.tail[1]);
    s[i] = t;
  }
  s.sort(); const q = p => s[Math.min(N-1, Math.floor(p*N))];
  const mid = Math.round(q(0.5));
  // минуты шагов: базовая оценка, масштаб к медиане, остаток раздаём самым длинным шагам
  const base = o.legs.map((l,j) => (l.model === 'board' && l.plo != null ? (l.plo + 0.4*(l.phi-l.plo)) + l.iv*(0.5 + l.skip) : (l.lo + 0.4*(l.hi-l.lo))) * K[j]), sb = base.reduce((a,b)=>a+b,0);
  const legMins = base.map(b => Math.max(1, Math.floor(b*mid/sb)));
  let rest = mid - legMins.reduce((a,b)=>a+b,0);
  const order = base.map((b,i)=>i).sort((a,b)=>base[b]-base[a]);
  for(let i=0; rest>0; i=(i+1)%order.length){ legMins[order[i]]++; rest--; }
  return FC[k] = { mid, p95: Math.ceil(q(0.95)), legMins,
    chance: budget => { let lo=0, hi=N; while(lo<hi){ const m=(lo+hi)>>1; if(s[m]<=budget) lo=m+1; else hi=m; } return lo/N; } };
}
const legMin = (k, i) => forecast(k).legMins[i];
const DAY = 24*60;
const fmt = m => { m = Math.round(m); const h = Math.floor(m/60)%24, mm = ((m%60)+60)%60; return h + ':' + String(mm).padStart(2,'0'); };
const fmtD = m => fmt(m) + (m >= DAY ? ' завтра' : '');
const dur = m => { m = Math.round(m); return m>=60 ? Math.floor(m/60) + ' ч' + (m%60 ? ' ' + m%60 + ' мин' : '') : m + ' мин'; };
const delayWhy = k => OPTIONS[k].delayWhy || 'если задержишься';
const goVerb = k => OPTIONS[k].verb || 'Выходи';
const arriveMode = () => state.mode==='hurry' && state.timeMode==='arrive';
const dep = () => state.timeMode==='depart' || state.mode!=='hurry' ? state.depart : NOW;
const latest = k => state.arrive - forecast(k).p95;
/* Итог — по вероятности успеть (одинаково для всех видов транспорта):
   ≥ 95% надёжно · 50–95% есть риск · 10–50% скорее опоздаешь · < 10% не успеешь.
   Режим «Выйти в»: по относительному разбросу (самое позднее − обычное) / обычное. */
function verdict(k){
  const o = OPTIONS[k], f = forecast(k);
  if(o.closed) return { cls:'', word:(o.closedInfo||{}).word || 'сейчас не работает', closed:true, plan:'now' };
  if(!arriveMode() || o.noTarget){
    const rel = (f.p95 - f.mid) / f.mid;
    return rel <= 0.15 ? { cls:'g', word:'стабильно' } : rel <= 0.30 ? { cls:'a', word: o.varyWord || 'бывает дольше' } : { cls:'r', word:'непредсказуемо' };
  }
  const L = latest(k);
  if(L >= NOW + 1) return { cls:'g', word:'надёжно', plan:'until', L, spare: L - NOW };          // есть время собраться
  const budget = state.arrive - NOW, p = f.chance(budget);
  if(p >= 0.95) return { cls:'g', word:'надёжно', plan:'now' };
  if(p >= 0.5)  return { cls:'a', word: o.riskWord || 'есть риск', plan:'now', badLate: f.p95 - budget };
  if(p >= 0.1)  return { cls:'r', word:'скорее опоздаешь', plan:'now', late: Math.max(1, f.mid - budget) };
  return { cls:'r', word:'не успеешь', plan:'now', late: f.mid - budget, never:true };
}
// Цель «к 9:00» не теряется и в режиме «Выйти в»
function bestOption(keys){
  // «Прибыть к»: сначала надёжность, потом время; без цели — кто раньше будет на месте (самое позднее)
  const score = k => { const v = verdict(k), f = forecast(k); if(!arriveMode()) return f.p95; const rank = v.cls==='g' ? 0 : v.cls==='a' ? 1 : 2; return rank*1e4 + f.mid; };
  const ks = keys.filter(k=>!OPTIONS[k].noTarget && !verdict(k).closed); if(!ks.length) return null;
  return ks.reduce((a,b)=>score(b)<score(a)?b:a);
}

function tplTime(t){   // «выйди до 8:23» для шаблона — считаем как для выбранного времени, затем возвращаем выбор
  const keep = { dest:state.dest, timeMode:state.timeMode, arrive:state.arrive, depart:state.depart, mode:state.mode };
  Object.assign(state, { dest:t.dest, timeMode:t.arrive!=null?'arrive':'depart', arrive:t.arrive!=null?t.arrive:state.arrive, depart:NOW, mode:'hurry' });
  syncCtx();
  if(!OPTIONS[t.mode]){ Object.assign(state, keep); SYNC_KEY = null; syncCtx(); return `<div class="m">способ</div><b>выключен</b>`; }
  const f = forecast(t.mode), v = verdict(t.mode);
  const out = t.arrive==null ? `<div class="m">в пути</div><b>~${dur(f.mid)}</b>` : v.closed ? `<div class="m">${OPTIONS[t.mode].name.toLowerCase()}</div><b>закрыто</b>` : v.plan==='until' ? `<div class="m">выйди до</div><b>${fmtD(v.L)}</b>` : `<div class="m">${goVerb(t.mode).toLowerCase()}</div><b>сейчас</b>`;
  Object.assign(state, keep); SYNC_KEY = null; syncCtx();   // вернуть контекст текущего выбора
  return out;
}

V.compare = () => {
  const walkMode = state.mode==='walk', arr = arriveMode();
  const keys = (walkMode ? walkKeys() : goKeys()).sort((a,b) => !!verdict(a).closed - !!verdict(b).closed);   // закрытые — в конец
  const best = walkMode ? null : bestOption(keys);
  const allLate = arr && keys.length && keys.every(k=>verdict(k).cls==='r');
  let late = '';
  if(allLate && fastest()){
    const fk = fastest(), f = forecast(fk), nextT = Math.ceil((NOW + f.p95) / 15) * 15;
    late = `<div class="banner late" role="alert"><b>К ${fmtD(state.arrive)} уже не успеть</b><br>Быстрее всего — ${OPTIONS[fk].name.toLowerCase()}, будешь около ${fmt(NOW+f.mid)}
      <div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="chip press" onclick="setTime(${nextT})">Показать к ${fmt(nextT)}</button><button class="chip press" onclick="pick('${fk}')">Самый быстрый</button><button class="chip press" onclick="lateMsg('${fk}')">Предупредить, что опоздаю</button></div></div>`;
  }
  const w = collect('banners').map((b,i) => `<div class="hint"><span aria-hidden="true">${icn(b.icon)}</span> <span><b>${esc(b.title)}</b>${b.text ? ' — ' + esc(b.text) : ''}</span>${i===0 ? modsLink() : ''}</div>`).join('');
  return `<div class="row"><button class="back-btn" aria-label="Назад" onclick="back()">${ic('Назад')}</button><h1 tabindex="-1" style="margin:0">${destName()}</h1></div>
  <div class="tripbar"><span class="from"><i aria-hidden="true"></i>Отсюда</span>${timeBtn()}</div>
  ${late}
  ${keys.length ? keys.map(k=>card(k, k===best && !allLate)).join('') : `<div class="offer"><div class="t">Нет включённых способов</div><div class="m" style="margin:4px 0 10px">${walkMode ? 'Для прогулок нужен модуль «Пешком»' : 'Включи хотя бы один способ передвижения'}</div>${walkMode ? `<button class="chip on press" onclick="toggleMod('walk')">Включить «Пешком»</button>` : `<button class="chip on press" onclick="go('modules')">Модули</button>`}</div>`}
  ${w}
  <div class="note">Время, цены и ориентиры в прототипе примерные. «Самое позднее» — так в 19 поездках из 20.</div>`;
};
function fastest(){ const ks = goKeys().filter(k=>!verdict(k).closed && !OPTIONS[k].noTarget); return ks.length ? ks.reduce((a,b)=>forecast(b).mid<forecast(a).mid?b:a) : null; }
function card(k, isBest){
  const o = OPTIONS[k], f = forecast(k), v = verdict(k), arr = arriveMode() && !o.noTarget;
  let right, pills = [];
  if(v.closed){ const c = (o.closedInfo||{}).card || ['', 'закрыто', '']; right = `<div class="m">${c[0]}</div><div class="big">${c[1]}</div><div class="m">${c[2]}</div>`; pills.push(`<span class="pill">${v.word}</span>`); }
  else if(o.noTarget){ right = `<div class="big">${f.mid} мин</div><div class="m">${o.price}</div>`; pills.push(`<span class="pill">когда захочешь</span>`); }
  else if(arr && v.plan==='until'){
    right = `<div class="m">выйди до</div><div class="big">${fmtD(v.L)}</div><div class="m">${v.spare >= 120 ? '' : 'ещё ' + dur(v.spare)}</div>`;
    pills.push(`<span class="pill g">${v.word}</span>`, `<span class="pill">в пути ~${dur(f.mid)}</span>`);
  } else if(arr){
    right = `<div class="m">${goVerb(k).toLowerCase()}</div><div class="big">сейчас</div><div class="m">будешь ~${fmt(NOW+f.mid)}</div>`;
    pills.push(`<span class="pill ${v.cls}">${v.word}</span>`);
    if(v.badLate) pills.push(`<span class="pill">${delayWhy(k)} — опоздаешь на ${v.badLate} мин</span>`);
    else if(v.never) pills.push(`<span class="pill">опоздание ~${dur(v.late)}</span>`);
    else if(v.late) pills.push(`<span class="pill">обычно опоздание ~${dur(v.late)}</span>`);
  } else {
    const d = dep();
    right = `<div class="m">будешь в</div><div class="big">${fmtD(d+f.mid)}</div><div class="m">самое позднее ${fmt(d+f.p95)}</div>`;
    pills.push(`<span class="pill ${v.cls}">${v.word}</span>`);
  }
  if(!v.never && !v.closed) collect('cardPills', k).forEach(t => pills.push(`<span class="pill">${esc(t)}</span>`));
  const compact = arr && v.never;
  if(v.closed) return `<div class="card late" data-k="${k}" aria-disabled="true">
    <div class="top"><div class="ico" aria-hidden="true">${icn(o.ico)}</div>
      <div style="flex:1;min-width:0"><div class="t">${o.name}</div><div class="m">${o.detail}</div></div>
      <div class="right">${right}</div></div>
    <div class="win">${pills.join('')}</div></div>`;   // закрытый способ — не открывается
  return `<button class="card press ${compact?'late':''}" data-k="${k}" onclick="pick('${k}')">
    ${isBest ? '<div class="best">Лучше всего</div>' : ''}
    <div class="top"><div class="ico" aria-hidden="true">${icn(o.ico)}</div>
      <div style="flex:1;min-width:0"><div class="t">${o.name}</div><div class="m">${o.detail}${o.noTarget?'':' · ' + o.price}</div></div>
      <div class="right">${right}</div></div>
    <div class="win">${pills.join('')}</div></button>`;
}
function lateMsg(k){ const f = forecast(k), late = NOW + f.mid - state.arrive;
  const txt = `Опаздываю минут на ${late}, буду около ${fmt(NOW+f.mid)}`;
  try{ navigator.clipboard && navigator.clipboard.writeText(txt); }catch(e){}
  toast('Скопировано: «' + txt + '»'); }

   <div class="chips" style="margin-top:6px">${(arr ? ARR_CHIPS : DEP_CHIPS).map(t=>`<button class="chip press ${t===cur?'on':''}" aria-pressed="${t===cur}" data-t="${t}" onclick="chipTime(${t})">${!arr && t===NOW ? 'Сейчас' : fmt(t)}</button>`).join('')}</div>
   <div class="wheel" role="group" aria-label="Время">
     <div class="col" id="wh" tabindex="0" role="spinbutton" aria-label="Часы" aria-valuemin="0" aria-valuemax="23">${H.map(h=>`<div class="it" aria-hidden="true">${h}</div>`).join('')}</div>
     <div class="colon" aria-hidden="true">:</div>
     <div class="col" id="wm" tabindex="0" role="spinbutton" aria-label="Минуты" aria-valuemin="0" aria-valuemax="55">${M.map(m=>`<div class="it" aria-hidden="true">${String(m).padStart(2,'0')}</div>`).join('')}</div>
     <div class="lens" aria-hidden="true"></div>
   </div>

   <button class="btn p press" onclick="applyTime()">Готово</button>`;

const IT = 44;
function colIdx(col){ return Math.max(0, Math.min(col.children.length-1, Math.round(col.scrollTop/IT))); }
function setCol(col, i, smooth){ i = Math.max(0, Math.min(col.children.length-1, i)); col.scrollTo({top:i*IT, behavior: smooth && !reduced ? 'smooth' : 'auto'}); }
function syncTime(t){ // черновик = выбранное значение, а не положение прокрутки
  state.draft.t = t;
  const wh = document.getElementById('wh'), wm = document.getElementById('wm'); if(!wh) return;
  const tod = ((t % DAY) + DAY) % DAY, h = Math.floor(tod/60), m = tod % 60;
  wh.setAttribute('aria-valuenow', h); wh.setAttribute('aria-valuetext', h + ' часов');
  wm.setAttribute('aria-valuenow', m); wm.setAttribute('aria-valuetext', m + ' минут');
  document.querySelectorAll('.chips .chip[data-t]').forEach(c => { const on = +c.dataset.t === t; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  const arr = state.draft.mode==='arrive', past = tod < NOW;
  const note = document.getElementById('timeNote');
  if(note) note.textContent = (past ? 'Это время уже прошло сегодня — будет завтра. ' : '') + (arr ? 'Прогноз покажет, когда выйти' : 'Прогноз покажет, во сколько будешь на месте');
}
function wheelTime(){ const wh = document.getElementById('wh'), wm = document.getElementById('wm'); let t = colIdx(wh)*60 + colIdx(wm)*5; return t; }
function normDay(t){ t = ((t % DAY) + DAY) % DAY; return t < NOW ? t + DAY : t; }   // прошедшее время — это завтра
function setupWheel(){
  const wh = document.getElementById('wh'), wm = document.getElementById('wm'); if(!wh) return;
  const tod = ((state.draft.t % DAY) + DAY) % DAY;
  wh.scrollTop = Math.floor(tod/60) * IT; wm.scrollTop = Math.round((tod%60)/5) * IT;
  syncTime(state.draft.t);
  for(const col of [wh, wm]){
    const n = col.children.length;
    let st; col.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => { if(state.view==='time' && document.getElementById('wh')) syncTime(normDay(wheelTime())); }, 90); });
    col.addEventListener('click', e => { const it = e.target.closest('.it'); if(!it) return; const i = [...col.children].indexOf(it); setCol(col, i, true);
      const t = col===wh ? i*60 + colIdx(wm)*5 : colIdx(wh)*60 + i*5; syncTime(normDay(t)); });
    col.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); const i = colIdx(col) + Math.sign(e.deltaY); setCol(col, i, true);
      const t = col===wh ? Math.max(0,Math.min(n-1,i))*60 + colIdx(wm)*5 : colIdx(wh)*60 + Math.max(0,Math.min(n-1,i))*5; syncTime(normDay(t)); }, {passive:false});
    col.addEventListener('keydown', e => {
      const step = {ArrowDown:1, ArrowUp:-1, PageDown:3, PageUp:-3}[e.key];
      let i = colIdx(col);
      if(step) i += step; else if(e.key==='Home') i = 0; else if(e.key==='End') i = n-1;
      else if(e.key==='Enter'){ e.preventDefault(); applyTime(); return; } else if(e.key==='Escape'){ e.preventDefault(); back(); return; } else return;
      e.preventDefault(); setCol(col, i, false);
      const ci = Math.max(0, Math.min(n-1, i)); syncTime(normDay(col===wh ? ci*60 + colIdx(wm)*5 : colIdx(wh)*60 + ci*5)); });
  }
}
function chipTime(t){ const wh = document.getElementById('wh'), wm = document.getElementById('wm'); const tod = t % DAY;
  setCol(wh, Math.floor(tod/60), true); setCol(wm, Math.round((tod%60)/5), true); syncTime(t); }
function applyTime(){
  const dr = state.draft, t = dr.t;
  state.timeMode = dr.mode; if(dr.mode==='arrive') state.arrive = t; else state.depart = Math.max(NOW, t);
  back(); say((dr.mode==='arrive' ? 'Прибыть к ' : 'Выйти в ') + fmtD(t));
  setTimeout(()=>{ const b = document.querySelector('.tripbar .when'); if(b) b.focus({preventScroll:true}); }, 0);
}
function setTimeMode(m){ const dr = state.draft; if(dr.mode===m) return; const t = dr.t; dr.mode = m;
  dr.t = m==='arrive' ? (t===NOW ? state.arrive : t) : t;
  render(); }
function setTime(t){ if(arriveMode()) state.arrive = t; else state.depart = t; render(); }

V.route = () => {
  if(!OPTIONS[state.sel] || (state.mode==='walk') !== (OPTIONS[state.sel].purpose==='walk')){ lostMode(); return V.compare(); }   // способ выключили — к способам
  const k = state.sel, o = OPTIONS[k], f = forecast(k), v = verdict(k), arr = arriveMode() && !o.noTarget;
  const start = arr ? (v.plan==='until' ? v.L : NOW) : dep();
  let t = start;
  const icon = l => ic(l.type==='walk' ? 'Пешком' : l.type==='metro' ? 'Метро' : l.type==='wait' ? (l.model==='exit' ? 'Эскалатор' : 'Песочные часы') : ICON[o.legIco] ? o.legIco : 'Машина', 16);
  const steps = o.legs.map((l,i) => { const mid = legMin(k,i); const s = `<div class="st ${l.type==='metro'?'metro':''}"><div class="dot" aria-hidden="true" style="${l.type==='metro'?'background:var(--metro3);color:#fff':''}">${icon(l)}</div>
     <div class="tx"><b>${l.label}</b><div class="m">${fmt(t)} · ~${mid} мин${l.lo!==l.hi?' (обычно '+l.lo+'–'+l.hi+')':''}</div> ${collect('stepHints', legView(k, l), t).map(h => `<div class="lm${h.warn?' w':''}"><span aria-hidden="true">${icn(h.icon, 16)}</span> ${esc(h.text)}</div>`).join('')}${l.lm?`<div class="lm${l.warn?' w':''}"><span aria-hidden="true">${ic(l.warn?'Внимание':'Пин', 16)}</span> ${l.lm}</div>`:''}</div></div>`; t += mid; return s; }).join('');
  const vp = visiblePois(k);
  const pois = vp.length ? `<div class="m" style="margin:4px 0 4px">По пути</div><div class="pois">${vp.map((p,i)=>`<button class="poi press" onclick="flyPoi(${i})"><div class="e" aria-hidden="true">${icn(p.e, 22)}</div><b>${esc(p.n)}</b><span>${esc(p.d)}${p.extra ? ' · ' + esc(p.extra) : ''}</span></button>`).join('')}</div>` : '';
  let head;
  if(v.closed){ const c = o.closedInfo || {}; head = `<h1 tabindex="-1">${c.head || o.name + ' сейчас не работает'}</h1><div class="sub">${c.sub || ''}</div>`; }
  else if(o.noTarget) head = `<h1 tabindex="-1">${o.name}</h1><div class="sub">~${f.mid} мин · ${o.price} · можно сократить в любой момент</div>`;
  else if(!arr){ const d = dep();
    head = `<h1 tabindex="-1">Выйдешь ${d===NOW?'сейчас':'в '+fmt(d)} — будешь в ${fmtD(d+f.mid)}</h1><div class="sub">${o.name} · ${o.price} · самое позднее ${fmt(d+f.p95)}</div><div class="row" style="flex-wrap:wrap;gap:6px"><span class="pill ${v.cls}">${v.word}</span></div>`; }
  else if(v.plan==='until' && v.spare >= 120) head = `<h1 tabindex="-1">${goVerb(k)} в ${fmtD(v.L)}</h1><div class="sub">В пути ~${dur(f.mid)} — будешь около ${fmt(v.L+f.mid)}, самое позднее ${fmtD(state.arrive)}</div><span class="pill g">${v.word}</span>`;
  else if(v.plan==='until') head = `<h1 tabindex="-1">${goVerb(k)} до ${fmtD(v.L)}</h1><div class="sub">Ещё ${dur(v.spare)} на сборы. В пути ~${dur(f.mid)} — будешь около ${fmt(v.L+f.mid)}, самое позднее ${fmtD(state.arrive)}</div><span class="pill g">${v.word}</span>`;
  else if(!v.cls.startsWith('r') ) head = `<h1 tabindex="-1">${goVerb(k)} сейчас</h1><div class="sub">Обычно будешь в ${fmt(NOW+f.mid)}${v.badLate ? ', но ' + delayWhy(k) + ' — опоздаешь на ' + v.badLate + ' мин' : ', самое позднее ' + fmt(NOW+f.p95)}</div><span class="pill ${v.cls}">${v.word}</span>`;   // заголовок — действие, итог — в пилюле
  else if(!v.never) head = `<h1 tabindex="-1">${goVerb(k)} сейчас</h1><div class="sub">Обычно будешь в ${fmt(NOW+f.mid)}, это ~${dur(v.late)} опоздания. Успеешь, только если повезёт</div><span class="pill r">${v.word}</span>`;
  else head = `<h1 tabindex="-1">К ${fmtD(state.arrive)} не успеть</h1><div class="sub">Выйдешь сейчас — будешь около ${fmt(NOW+f.mid)}, опоздание ~${dur(v.late)}</div><div class="row" style="flex-wrap:wrap;gap:6px"><button class="chip press" onclick="lateMsg('${k}')">Предупредить, что опоздаю</button></div>`;
  const cta = o.cta || (arr && v.never ? 'Всё равно поехать' : 'Поехали');
  // До выхода больше часа: ничего не вызываем сейчас — напоминание за 10 мин; поездку можно проиграть в демо
  const far = arr && v.plan==='until' && v.spare >= 60;
  const remindAt = far ? v.L - 10 : 0;
  const goBtn = far
    ? `<button class="btn p press" id="remindBtn" onclick="remind(${remindAt})">Напомнить в ${fmtD(remindAt)}</button><button class="btn w press" id="goBtn" style="margin-top:8px" onclick="startTrip(true)">Демо: проиграть поездку</button>`
    : `<button class="btn ${arr && v.never ? 'w' : 'p'} press" id="goBtn" onclick="${o.confirm ? "go('confirm')" : 'startTrip()'}">${cta}</button>`;
  return `<div class="row"><button class="back-btn" aria-label="Назад" onclick="back()">${ic('Назад')}</button><div class="m">Маршрут с ориентирами</div></div>
    ${head}${!o.noTarget && state.dest && !isSaved() && !v.closed ? `<div><button class="savebtn" onclick="go('save')">${ic('Звезда', 18)} Сохранить маршрут</button></div>` : ''}${v.closed ? closedAlt(k) : `<div class="steps">${steps}</div>${pois}`}
    ${v.closed ? '' : `<div class="gobar">${goBtn}</div>`}`;
};
// Способ сейчас не работает — сразу предложить работающие
function closedAlt(k){ const alt = (state.mode==='walk' ? walkKeys() : goKeys()).filter(x => x !== k && !verdict(x).closed);
  return alt.length ? `<div class="sec">Сейчас можно так</div>` + alt.map(x => card(x, false)).join('') : `<div class="m" style="margin:10px 0">Других способов сейчас нет — включи их в <button class="mlink" onclick="go('modules')">Модулях</button></div>`; }
function remind(m){ toast('Напомню в ' + fmtD(m) + ' — за 10 мин до выхода'); say('Напоминание на ' + fmtD(m)); }
// Когда начинается поездка: тот же расчёт, что показывает маршрут
function tripStart(k){ const o = OPTIONS[k], v = verdict(k);
  return arriveMode() && !o.noTarget ? (v.plan==='until' ? v.L : NOW) : dep(); }
// Точки «По пути»: свои у варианта + от включённых модулей
function visiblePois(k){ return (OPTIONS[k].pois||[]).concat(collect('pois', k)); }
// Подтверждение перед платным действием
V.confirm = () => {

  return `<div class="row"><button class="back-btn" aria-label="Назад" onclick="back()">${ic('Назад')}</button><div class="m">${c.crumb}</div></div>
   <h1 tabindex="-1">${c.title}</h1>

     ${c.rows.map((r,i)=>`<div class="row" style="justify-content:space-between${i?';margin-top:8px':''}"><span class="m">${r[0]}</span><b>${r[1]}</b></div>`).join('')}

};
function modCard(m){ const on = !!state.modules[m.id];
  const need = (m.requires || []).filter(id => !isOn(id)).map(id => (MODULES.find(x=>x.id===id) || {name:id}).name);

V.done = () => {

  const chips = o.noTarget ? ['Было приятно','Слишком долго','Хочу другой маршрут'] : ['Всё по плану','Была задержка','Сложно найти'];
  // Предложить сохранить: путь похож на рутинный (задано «к …» или второй раз сюда), ещё не сохранён и не отказывались

   <div class="sub">${sub}</div>

     <div class="row"><button class="chip on press" onclick="go('save')">Сохранить</button><button class="chip press" onclick="state.declined[state.dest]=1;render()">Не сейчас</button></div></div>` : ''}

};

/* ----- Сохранение маршрута ----- */
V.save = () => {
  if(!OPTIONS[state.sel]) return `<div class="row"><button class="back-btn" aria-label="Назад" onclick="back()">${ic('Назад')}</button><h1 tabindex="-1" style="margin:0">Сохранить маршрут</h1></div>
   <div class="sub" style="margin-top:6px">Сначала выбери способ — сохраним маршрут вместе с ним</div>`;
  if(state.justSaved) return `<h1 tabindex="-1">Сохранено: ${state.justSaved}</h1>
    <div class="sub">Найдёшь его под поиском — в одно касание</div>
    <div class="offer"><div class="t">Добавить обратный путь?</div><div class="m" style="margin:4px 0 10px">${PLACES[state.dest].name} → сюда</div>
    <div class="row"><button class="chip on press" onclick="saveReverse(true)">Добавить</button><button class="chip press" onclick="saveReverse(false)">Не нужно</button></div></div>`;
  const arr = arriveMode(), nm = state.saveName || null;   // название выбирает человек
  return `<div class="row"><button class="back-btn" aria-label="Назад" onclick="back()">${ic('Назад')}</button><h1 tabindex="-1" style="margin:0">Сохранить маршрут</h1></div>
   <div class="sub" style="margin-top:6px">Отсюда → ${PLACES[state.dest].name}</div>
   <div class="sec">Как назвать</div>
   <div class="chips" style="flex-wrap:wrap">${['Работа','Учёба','Спорт'].map(n=>`<button class="chip press ${nm===n?'sel':''}" aria-pressed="${nm===n}" onclick="state.saveName='${n}';render()">${n}</button>`).join('')}
     <button class="chip press ${nm && !['Работа','Учёба','Спорт'].includes(nm)?'sel':''}" onclick="askName()">${nm && !['Работа','Учёба','Спорт'].includes(nm) ? esc(nm) : 'Своё…'}</button></div>
   <div class="card" style="cursor:default">
     <div class="row" style="justify-content:space-between"><span class="m">Время</span><b>${arr ? 'прибыть к ' + fmt(state.arrive) : 'без времени'}</b></div>
     <div class="row" style="justify-content:space-between;margin-top:8px"><span class="m">Способ</span><b>${OPTIONS[state.sel].name}</b></div>
     <div class="m" style="margin-top:10px">Если способ недоступен (ночью метро закрыто) — предложим другой. Дни недели и напоминание «пора выходить» — в следующей версии.</div>
   </div>
   <button class="btn p press" ${nm ? '' : 'disabled aria-disabled="true" style="opacity:.5"'} onclick="saveTemplate()">${nm ? 'Сохранить' : 'Выбери название'}</button>`;
};
function askName(){ const v = prompt('Название маршрута', state.saveName || ''); if(v && v.trim()){ state.saveName = v.trim().replace(/['"<>&]/g,'').slice(0,24) || 'Мой маршрут'; render(); } }
function saveTemplate(){
  const name = state.saveName; if(!name) return;
  state.templates.push({ name, dest:state.dest, arrive: arriveMode() ? state.arrive : null, mode: state.sel });
  state.justSaved = name; render('in'); say('Маршрут сохранён: ' + name);
}
function saveReverse(yes){
  if(yes) state.templates.push({ name:'Обратно', dest:state.dest, arrive:null, mode:state.sel, reverse:true });
  toast(yes ? 'Обратный путь добавлен' : 'Сохранено');
  state.justSaved = null; state.saveName = null; back();
}
function useTemplate(i){ const t = state.templates[i];
  if(t.reverse){ toast('В прототипе обратный путь пока не строится'); return; }
  Object.assign(state, { dest:t.dest, mode:'hurry', timeMode: t.arrive!=null ? 'arrive' : 'depart', arrive: t.arrive!=null ? t.arrive : state.arrive, depart:NOW });
  syncCtx(); state.sel = OPTIONS[t.mode] && !verdict(t.mode).closed ? t.mode : null;
  if(!state.sel){ toast('Сохранённый способ сейчас недоступен — выбери другой'); go('compare'); return; }
  // в одно касание: сразу маршрут сохранённым способом; «назад» — к остальным способам
  state.history.push('home'); state.view = 'compare'; showRoute(state.sel); go('route'); fitAll(); }
function openPlace(k){
  if(!PLACES[k].ok){ toast('В прототипе маршруты есть только до м. Бауманская'); return; }
  state.dest = k; state.mode = 'hurry'; syncCtx(); state.sel = goKeys()[0] || null; state.timeMode = 'depart'; state.depart = NOW; state.q = '';
  state.recents = [k].concat(state.recents.filter(x=>x!==k)).slice(0,3);
  if(state.view==='find'){                        // «назад» из места — туда, откуда открыли поиск, а не в поиск
    state.view = state.history.pop() || 'home';
    if(state.view==='place'){ render('in'); snapFor('place'); showPlace(); return; }   // поиск из шторки места → то же место, новое содержимое
  }

function walkNearby(){ state.mode = 'walk'; state.dest = null; state.timeMode = 'depart'; state.depart = NOW; syncCtx(); state.sel = walkKeys()[0] || null;
  if(state.sel){ showRoute(state.sel); fitAll(); } go('compare'); }
function resetDemo(){ Object.assign(state, { templates:[], recents:[], visits:{}, declined:{}, dest:null, saveName:null, q:'', justSaved:null, mode:'hurry', timeMode:'depart', depart:NOW, arrive:9*60, sel:null }); restart(); toast('Демо сброшено: первый запуск'); }
// Верхняя панель: поиск («Куда?» или выбранное место) и модули; на главном — «Погулять рядом»
function renderTop(){
  const tb = document.getElementById('topbar'), v = state.view, show = (v==='home' || v==='place') && !trip.on;
  tb.classList.toggle('hide', !show); tb.inert = !show;
  document.getElementById('attrib').classList.toggle('low', v==='home');

    <button class="round press" aria-label="Модули" onclick="go('modules')">${ic('Шестерёнка', 22)}</button>
    ${v==='home' && walkKeys().length ? `<div class="brk"></div><button class="wchip press" onclick="walkNearby()">${ic('Пешком', 18)}Погулять рядом</button>` : ''}`;
}
const glue = h => h.replace(/(\d) (мин|ч|₽|км|м)(?=[\s<.,·)]|$)/g, '$1&nbsp;$2').replace(/≈ /g, '≈&nbsp;');
// Короткая блокировка кликов после смены экрана: второй тап двойного клика не попадает в новую кнопку
let navLock = 0; const lockNav = () => { navLock = performance.now() + 450; };

function go(v){ if(state.view===v) return;
