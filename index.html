  state.history.push(state.view); state.view = v; render('in'); snapFor(v); }
// Высота шторки для экрана: место — низкая, способы и служебные — высокая (карта остаётся сверху)
function snapFor(v){
  if(v==='home') snap(state.templates.length || state.recents.length ? 'half' : 'hidden');
  else if(v==='place') fitSheet();
  else if(v==='route' || v==='done') snap('half');
  else snap('full'); }
function back(){ const from = state.view; state.view = state.history.pop() || 'home';
  if(from==='compare' && state.view!=='compare' && state.mode==='walk'){ state.mode = 'hurry'; }
  render('back'); snapFor(state.view);
  if(state.view==='home') showHome(); else if(state.view==='place') showPlace();
  else if(state.view==='compare' && from!=='time' && from!=='modules'){ showRoute(state.sel); fitAll(); } }
function pick(k){ state.sel = k; showRoute(k); go('route'); fitAll(); }
function toggleMod(k){ state.modules[k] = !state.modules[k]; render(); say((state.modules[k]?'Включено':'Выключено'));
  if(routeKey) showRoute(state.sel); }   // точки модулей на карте
function thanks(){ toast('Спасибо! Учту в прогнозе'); }
function restart(){ state.view='home'; state.history=[]; state.mode='hurry'; state.timeMode='depart'; state.depart=NOW; render('back'); snapFor('home'); showHome(); }
function say(t){ document.getElementById('live').textContent = t; }

/* ================= ШТОРКА ================= */
const sheet = document.getElementById('sheet'), phone = document.getElementById('phone');
let snapY = 0;
// Шторка ровно по содержимому (экран места): ручка + контент + отступ снизу 24 px
function fitSheet(){
  const view = body.firstElementChild; if(!view) return;
  sheet.classList.add('tight');
  const h = document.getElementById('grab').offsetHeight + 4 + view.offsetHeight + 24;
  sheet.classList.add('anim'); snapY = Math.min(phone.clientHeight*0.6, h); sheet.style.height = snapY + 'px'; sheet.dataset.snap = 'place';
}
function snaps(){ const H = phone.clientHeight; return { full: H*0.82, half: H*0.56, place: 270, peek: 150, hidden: 0 }; }
function snap(name){ sheet.classList.remove('tight'); sheet.classList.add('anim'); snapY = snaps()[name]; sheet.style.height = snapY + 'px'; sheet.dataset.snap = name;
  document.getElementById('grab').setAttribute('aria-expanded', name==='full'); }
const ORDER = ['peek','half','full'];
document.getElementById('grab').addEventListener('click', e => { if(dragMoved) return; const i = ORDER.indexOf(sheet.dataset.snap); snap(i < 0 ? 'full' : ORDER[(i+1)%3]); });
let dragMoved = false;
(function drag(){
  let sy=0, st=0, dragging=false, lastY=0, lastT=0, v=0, pid=null;
  sheet.addEventListener('pointerdown', e => {
    if(e.button>0) return;
    if(e.target.closest('.wheel')) return;
    if(e.target.closest('.body') && body.scrollTop>0) return;
    dragging=true; dragMoved=false; v=0; sy=e.clientY; st=snapY; lastY=e.clientY; lastT=performance.now(); pid=e.pointerId;
  });
  window.addEventListener('pointermove', e => { if(!dragging || e.pointerId!==pid) return; const dy=e.clientY-sy;
    if(!dragMoved){ if(Math.abs(dy)<6) return; dragMoved=true; sheet.classList.remove('anim'); try{ sheet.setPointerCapture(pid); }catch(_){}}
    snapY = Math.min(phone.clientHeight*0.82, Math.max(110, st-dy)); sheet.style.height = snapY + 'px';
    const now=performance.now(); v=(e.clientY-lastY)/Math.max(1,now-lastT); lastY=e.clientY; lastT=now; });
  const end = e => { if(!dragging || (e && e.pointerId!==pid)) return; dragging=false; if(!dragMoved) return;
    const s=snaps(), aim = snapY - v*180;
    snap(ORDER.reduce((a,b)=>Math.abs(s[b]-aim)<Math.abs(s[a]-aim)?b:a));
    setTimeout(()=>{ dragMoved=false; }, 0); };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  // клик после перетаскивания не должен открывать карточку
  sheet.addEventListener('click', e => { if(dragMoved){ e.stopPropagation(); e.preventDefault(); } }, true);
  // колесо мыши: у верха списка — разворачивает/сворачивает шторку
  let wheelLock = 0;
  sheet.addEventListener('wheel', e => { if(e.target.closest('.wheel') || state.view==='time') return; const now = Date.now(); if(now < wheelLock) return;
    const i = ORDER.indexOf(sheet.dataset.snap);
    if(e.deltaY > 0 && i < 2){ e.preventDefault(); snap(ORDER[i+1]); wheelLock = now+400; }
    else if(e.deltaY < 0 && body.scrollTop<=0 && i > 0){ e.preventDefault(); snap(ORDER[i-1]); wheelLock = now+400; } }, {passive:false});
})();
phone.addEventListener('click', e => { if(performance.now() < navLock){ e.stopPropagation(); e.preventDefault(); } }, true);

/* ================= КАРТА ================= */
let map, mapOk=false; const markers=[]; const geo={};
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2600); }
function pinEl(text, cls){ const d=document.createElement('div'); d.className='pin '+(cls||''); d.textContent=text; return d; }
function addMarker(el, ll, anchor){ if(!mapOk) return null; const m=new maplibregl.Marker({element:el, anchor:anchor||'bottom'}).setLngLat(ll).addTo(map); markers.push(m); return m; }
function clearMarkers(){ while(markers.length) markers.pop().remove(); }

function fetchRoute(profile, pts){
  const key = profile + pts.map(p=>p.join(',')).join(';');
  if(geo[key]) return geo[key];
  const base = profile==='foot' ? 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' : 'https://routing.openstreetmap.de/routed-car/route/v1/driving/';
  const p = (async () => {
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 6000);
    try{
      const r = await fetch(base + pts.map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(';') + '?overview=full&geometries=geojson', {signal:ctl.signal});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(!(j.routes && j.routes[0])) throw new Error('no route');
      return j.routes[0].geometry.coordinates;
    } catch(e){
      delete geo[key];                        // запасной вариант не кэшируем — попробуем ещё раз позже
      if(!fetchRoute.warned){ fetchRoute.warned = true; toast('Маршрут по улицам не загрузился — показываю схематично'); }
      return pts;
    } finally { clearTimeout(to); }
  })();
  return geo[key] = p;
}
function metroSlice(stations){
  const seg = BAKED.seg, near = p => seg.reduce((b,q,i)=>dist(q,p)<dist(seg[b],p)?i:b, 0);
  const a = near(ST[stations[0]]), b = near(ST[stations[stations.length-1]]);
  return seg.slice(Math.min(a,b), Math.max(a,b)+1);
}
function legCoords(l){
  if(l.geom && BAKED.routes[l.geom]) return Promise.resolve(BAKED.routes[l.geom]);
  if(l.type==='metro') return Promise.resolve(metroSlice(l.stations));
  if(l.type==='wait') return Promise.resolve([l.at, l.at]);
  return fetchRoute(l.type==='walk'?'foot':'car', [l.from].concat(l.via||[]).concat([l.to]));
}
function prepLeg(c, l){ const seg=[]; let tot=0; for(let i=1;i<c.length;i++){ const d=dist(c[i-1],c[i]); seg.push(d); tot+=d; }
  const L = { c, seg, tot };
  if(l && l.type==='metro'){ // доля пути до каждой станции — чтобы «выходить через N» совпадало с картой
    const cum=[0]; for(const d of seg) cum.push(cum[cum.length-1]+d);
    L.stFrac = l.stations.map(n=>{ let bi=0; c.forEach((q,i)=>{ if(dist(q,ST[n])<dist(c[bi],ST[n])) bi=i; }); return tot?cum[bi]/tot:0; }); }
  return L; }
let routeLegs = [], routeKey = null, routeReady = Promise.resolve();
function showRoute(k){
  if(!OPTIONS[k]){ clearRoute(); return routeReady = Promise.resolve(); }   // способ выключен — маршрута нет
  const o = OPTIONS[k]; const token = showRoute.t = (showRoute.t||0)+1;
  routeReady = Promise.all(o.legs.map(legCoords)).then(cs => {
    if(token!==showRoute.t) return;                 // устаревший запрос (был return routeReady — промис ждал сам себя)
    routeLegs = cs.map((c,i)=>Object.assign({ l:o.legs[i] }, prepLeg(c, o.legs[i]))); routeKey = k;
    if(!mapOk) return;
    const fc = t => ({type:'FeatureCollection', features: routeLegs.filter(x=>x.l.type===t).map(x=>({type:'Feature',geometry:{type:'LineString',coordinates:x.c},properties:{}}))});
    map.getSource('r-walk').setData(fc('walk')); map.getSource('r-metro').setData(fc('metro')); map.getSource('r-car').setData(fc('car'));
    clearMarkers();
    addMarker(pinEl('Дом','dark'), HOME);
    if(!o.noTarget) addMarker(pinEl('М Бауманская','m3'), DEST);
    routeLegs.filter(x=>x.l.type==='metro').forEach(x=>x.l.stations.slice(1,-1).forEach(s=>{ const d=document.createElement('div'); d.className='st-dot'; addMarker(d, ST[s], 'center'); }));
    visiblePois(k).forEach(p=>addMarker(pinEl(p.n,'poi-pin'), p.at));
  });
  return routeReady;
}
// Главный: только «ты здесь». Место: ты и точка назначения, без линии маршрута.
function clearRoute(){ showRoute.t = (showRoute.t||0)+1; routeKey = null; if(!mapOk) return;
  const e = {type:'FeatureCollection',features:[]}; ['r-walk','r-metro','r-car'].forEach(id=>map.getSource(id).setData(e)); clearMarkers(); }
function showHome(){ clearRoute(); if(!mapOk) return; addMarker(pinEl('Ты здесь','dark'), HOME); map.flyTo({center:HOME, zoom:13.6, pitch:0, bearing:0, duration:reduced?0:800}); }
function showPlace(){ clearRoute(); if(!mapOk) return; addMarker(pinEl('Ты здесь','dark'), HOME); addMarker(pinEl('М Бауманская','m3'), DEST);
  map.fitBounds(new maplibregl.LngLatBounds(HOME, HOME).extend(DEST), {padding:{top:120,left:50,right:50,bottom:300}, pitch:0, bearing:0, duration:reduced?0:800}); }
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fitAll(){
  if(!mapOk || !OPTIONS[state.sel]) return; const o = OPTIONS[state.sel];
  const pts = [HOME].concat(o.noTarget?[]:[DEST], ...o.legs.map(l=>l.geom?BAKED.routes[l.geom]:l.type==='metro'?l.stations.map(s=>ST[s]):l.type==='wait'?[l.at]:[l.from,l.to].concat(l.via||[])));
  const b = pts.reduce((b,p)=>b.extend(p), new maplibregl.LngLatBounds(pts[0],pts[0]));
  map.fitBounds(b, {padding:{top:120,left:40,right:40,bottom:(snapY||phone.clientHeight*0.56)+20}, pitch:0, bearing:0, duration:reduced?0:800, maxZoom:15.5});
}
function flyPoi(i){ const p = visiblePois(state.sel)[i]; snap('peek'); if(mapOk) map.flyTo({center:p.at, zoom:16, pitch:45, duration:reduced?0:900}); toast(p.n + (p.extra ? ' · ' + p.extra : '')); }

function brand(){
  const layers = map.getStyle().layers;
  const set = (id,k,v) => { try{ map.setPaintProperty(id,k,v); }catch(e){} };
  const hide = id => { try{ map.setLayoutProperty(id,'visibility','none'); }catch(e){} };
  for(const l of layers){
    const id=l.id;
    if(l.type==='background') set(id,'background-color','#6C6CF0');
    else if(l.type==='fill'){
      if(/water/.test(id)) set(id,'fill-color','#8C8DF5');
      else if(/park|wood|grass|landcover|forest|garden/.test(id)) { set(id,'fill-color','#6464E6'); set(id,'fill-opacity',0.8); }
      else if(/building/.test(id)) set(id,'fill-color','#7B7CF2');
      else { set(id,'fill-color','#6E6EF0'); set(id,'fill-opacity',0.5); }
    }
    else if(l.type==='line'){
      if(/water|river/.test(id)) set(id,'line-color','#8C8DF5');
      else if(/boundary|admin/.test(id)) hide(id);
      else if(/rail|transit/.test(id)) set(id,'line-color','#5A5AD8');
      else if(/casing/.test(id)) set(id,'line-color','#5F5FE0');
      else if(/motorway|trunk|primary|secondary/.test(id)) { set(id,'line-color','#D7F26B'); set(id,'line-opacity',0.75); }
      else if(/road|street|minor|service|path|pedestrian|tertiary|highway|bridge|tunnel/.test(id)) set(id,'line-color','#9FA0F7');
    }
    else if(l.type==='fill-extrusion'){ set(id,'fill-extrusion-color','#8384F4'); set(id,'fill-extrusion-opacity',0.9); }
    else if(l.type==='symbol'){
      if(/poi/.test(id)) hide(id);
      else { set(id,'text-color','#FFFFFF'); set(id,'text-halo-color','#3E3EB8'); set(id,'text-halo-width',1.6); }
    }
  }
}
function addRouteLayers(){
  const empty = {type:'FeatureCollection',features:[]};
  ['r-walk','r-metro','r-car','r-me'].forEach(s=>map.addSource(s,{type:'geojson',data:empty}));
  const lay = {'line-cap':'round','line-join':'round'};
  map.addLayer({id:'car-shadow',type:'line',source:'r-car',layout:lay,paint:{'line-color':'#14113A','line-width':13,'line-opacity':0.35,'line-blur':6,'line-translate':[0,3]}});
  map.addLayer({id:'metro-shadow',type:'line',source:'r-metro',layout:lay,paint:{'line-color':'#14113A','line-width':13,'line-opacity':0.35,'line-blur':6,'line-translate':[0,3]}});
  map.addLayer({id:'car-case',type:'line',source:'r-car',layout:lay,paint:{'line-color':'#14113A','line-width':10}});
  map.addLayer({id:'car',type:'line',source:'r-car',layout:lay,paint:{'line-color':'#FFFFFF','line-width':6}});
  map.addLayer({id:'metro-case',type:'line',source:'r-metro',layout:lay,paint:{'line-color':'#FFFFFF','line-width':10}});
  map.addLayer({id:'metro',type:'line',source:'r-metro',layout:lay,paint:{'line-color':'#2E6FE6','line-width':6}});
  map.addLayer({id:'walk-case',type:'line',source:'r-walk',layout:lay,paint:{'line-color':'#14113A','line-width':8,'line-opacity':0.5}});
  map.addLayer({id:'walk',type:'line',source:'r-walk',layout:lay,paint:{'line-color':'#FFFFFF','line-width':4,'line-dasharray':[0.1,2]}});
  map.addLayer({id:'passed',type:'line',source:'r-me',layout:lay,paint:{'line-color':'#D7F26B','line-width':6}});
}
function showFallback(){ document.getElementById('fallback').style.display='flex'; }
function initMap(){
  if(!window.maplibregl){ showFallback(); return; }
  try{
    map = new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/liberty', center:[37.74,55.785], zoom:12.3, attributionControl:false });
  }catch(e){ showFallback(); return; }                 // нет WebGL
  const loadTimer = setTimeout(()=>{ if(!mapOk) showFallback(); }, 15000);
  map.on('load', () => {
    clearTimeout(loadTimer); mapOk = true; document.getElementById('fallback').style.display='none';
    brand(); addRouteLayers();
    if(trip.on) trip.lastLeg = -1;
    if(state.view==='home' || state.view==='find') showHome(); else if(state.view==='place') showPlace();
    else showRoute(state.sel).then(()=>{ if(!trip.on) fitAll(); });
  });
}

/* ================= ВЕДЕНИЕ ================= */
const dist = (a,b) => { const R=6371000, toR=Math.PI/180, dLat=(b[1]-a[1])*toR, dLon=(b[0]-a[0])*toR; const x=Math.sin(dLat/2)**2+Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const bearing = (a,b) => { const toR=Math.PI/180, y=Math.sin((b[0]-a[0])*toR)*Math.cos(b[1]*toR), x=Math.cos(a[1]*toR)*Math.sin(b[1]*toR)-Math.sin(a[1]*toR)*Math.cos(b[1]*toR)*Math.cos((b[0]-a[0])*toR); return Math.atan2(y,x)/toR; };
function along(L, f){
  const c = L.c, seg = L.seg; let t = f*L.tot;
  for(let i=0;i<seg.length;i++){ if(t<=seg[i]||i===seg.length-1){ const k=seg[i]?Math.min(1,t/seg[i]):0; const a=c[i], b=c[i+1];
    const p=[a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; return { p, brg: seg[i]?bearing(a,b):null, passed:c.slice(0,i+1).concat([p]) }; } t-=seg[i]; }
  return { p:c[c.length-1], brg:null, passed:c };
}
const trip = { on:false, t:0, speed:1, raf:0, me:null, tip:null, buzzed:false, lastLeg:-1, smoothBrg:0, lastSet:0, lastHtml:'', total:0, endAt:0, startAt:NOW, legs:[] };
const SIM_SECONDS_PER_MIN = 2.2;   // ×1: минута пути ≈ 2 секунды
async function startTrip(demo){
  if(trip.on) return;
  // история до поездки: после «Завершить» вернёмся на маршрут с тем же «назад»
  trip.hist = state.view==='confirm' ? state.history.slice(0, -1) : state.history.slice();
  trip.on = true;                                       // защита от двойного нажатия
  lockNav();
  const btn = document.getElementById('goBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Строю маршрут…'; }
  const k = state.sel, view0 = state.view;          // запоминаем выбор до ожидания: пока строится маршрут, человек мог уйти
  await routeReady;
  if(routeKey !== k) await showRoute(k);
  if(state.sel !== k || state.view !== view0){ trip.on = false; render(); return; }   // ушёл с экрана — поездку не начинаем (и такси без подтверждения не вызываем)
  const o = JSON.parse(JSON.stringify(OPTIONS[k]));      // поездка идёт на своей копии: выключение модуля её не ломает
  trip.k = k; trip.o = o;
  if(!demo && o.startToast) toast(o.startToast);
  document.getElementById('topbar').classList.add('hide'); document.getElementById('topbar').inert = true;
  sheet.inert = true; snap('hidden'); document.getElementById('guide').classList.add('on');
  document.getElementById('attrib').classList.add('guiding');
  Object.assign(trip, { t:0, buzzed:false, lastLeg:-1, smoothBrg: mapOk ? map.getBearing() : 0, lastSet:0, lastHtml:'' });
  trip.legs = o.legs.map((l,i)=>legMin(k,i));
  { let t0 = tripStart(k); trip.hints = o.legs.map((l,i) => { const h = collect('stepHints', legView(k, l), t0); t0 += trip.legs[i]; return h; }); }   // подсказки модулей на каждый шаг
  trip.total = trip.legs.reduce((s,m)=>s+m,0); trip.startAt = tripStart(k); trip.endAt = trip.startAt + trip.total;
  document.getElementById('geta').textContent = fmt(trip.endAt);
  const goal = document.getElementById('ggoal');
  if(arriveMode() && !o.noTarget){ const sp = state.arrive - trip.endAt;
    goal.className = 'pill ' + (sp >= 0 ? 'g' : 'r'); goal.textContent = sp >= 0 ? 'успеваешь к ' + fmtD(state.arrive) + ' · запас ' + dur(sp) : 'к ' + fmtD(state.arrive) + ' опоздание ~' + dur(-sp); goal.hidden = false;
  } else goal.hidden = true;
  const stop = document.getElementById('stopBtn'); stop.textContent = 'Завершить поездку'; stop.dataset.armed = '';
  setTimeout(()=>{ document.getElementById('gtop').focus({preventScroll:true}); }, 0);
  let last = performance.now();
  const tick = now => { if(!trip.on) return;
    const dt = Math.min(0.1, (now-last)/1000); last = now;   // после фоновой вкладки не перескакиваем
    trip.t += dt/SIM_SECONDS_PER_MIN*trip.speed; update(dt);
    if(trip.t>=trip.total){ finish(); return; } trip.raf=requestAnimationFrame(tick); };
  trip.raf = requestAnimationFrame(tick);
}
const KIND = { walk:'Пешком', car:'В пути', metro:'Метро' };
const modHints = li => (trip.hints && trip.hints[li] || []).map(h => `<div class="lmk"><span aria-hidden="true">${icn(h.icon, 16)}</span> ${esc(h.text)}</div>`).join('');
function update(dt){
  const o = trip.o; let acc=0, li=0;
  for(; li<o.legs.length-1; li++){ const m = trip.legs[li]; if(trip.t < acc+m) break; acc+=m; }
  const l = o.legs[li], lm = trip.legs[li], f = Math.min(1,(trip.t-acc)/lm), leg = routeLegs[li];
  const left = Math.max(0, Math.ceil(trip.total-trip.t));
  document.getElementById('clock').textContent = fmt(Math.floor(trip.startAt + trip.t));
  document.getElementById('gleft').textContent = left ? 'ещё ' + dur(left) : 'почти на месте';
  let html, alert=false;
  if(l.type==='metro'){
    const n = l.stations.length-1, fr = leg && leg.stFrac, passed = fr ? fr.filter((x,i)=>i>0 && x<=f+1e-6).length : Math.min(n, Math.floor(f*n+1e-4)), rest = n - passed;
    const next = l.stations[Math.min(n, passed+1)], lastSt = l.stations[n];
    if(rest<=1 && !trip.buzzed){ trip.buzzed=true; try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
      if(!reduced){ phone.classList.add('shake'); setTimeout(()=>phone.classList.remove('shake'),500); } say('Следующая — ' + lastSt + ', выходи'); }
    alert = rest<=1;
    html = `<div class="k">Метро · следующая ${next}</div><div class="h">${rest<=1 ? 'Следующая — ' + lastSt + ', выходи' : 'Выходить через ' + stops(rest)}</div>
      <div class="stations" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i<passed?'f':''}"></i>`).join('')}</div>${l.lm?`<div class="lmk"><span aria-hidden="true">${ic(l.warn?'Внимание':'Пин', 16)}</span> ${l.lm}</div>`:''}${modHints(li)}`;
  } else {
    const mleft = Math.max(1, Math.ceil(lm*(1-f)));
    const kind = l.kind || KIND[l.type] || 'Шаг';
    html = `<div class="k">${kind} · ${mleft}&nbsp;мин</div><div class="h">${l.label}</div>${l.lm?`<div class="lmk"><span aria-hidden="true">${ic(l.warn?'Внимание':'Пин', 16)}</span> ${l.lm}</div>`:''}${modHints(li)}`;
  }
  if(html !== trip.lastHtml){ const g = document.getElementById('gtop'); g.className = 'gtop' + (alert?' alert':''); g.innerHTML = html; trip.lastHtml = html; }
  if(trip.lastLeg!==li){ trip.lastLeg=li; say(l.label);
    if(mapOk){ if(trip.tip){ trip.tip.remove(); trip.tip=null; }
      if(l.tip && leg){ const d=document.createElement('div'); d.className='tip'; d.textContent=l.tip; trip.tip = new maplibregl.Marker({element:d, anchor:'bottom', offset:[0,-14]}).setLngLat(leg.c[leg.c.length-1]).addTo(map); } } }
  if(!mapOk || !leg) return;
  if(!trip.me){ const el=document.createElement('div'); el.className='me'; trip.me = new maplibregl.Marker({element:el}).setLngLat(leg.c[0]).addTo(map); }
  const a = along(leg, f);
  trip.me.setLngLat(a.p);
  const now = performance.now();
  if(now - trip.lastSet > 200){ trip.lastSet = now;     // пройденная линия — 5 раз в секунду
    const passedCoords = routeLegs.slice(0,li).flatMap(x=>x.c).concat(a.passed);
    map.getSource('r-me').setData({type:'Feature',geometry:{type:'LineString',coordinates:passedCoords.length>1?passedCoords:[a.p,a.p]},properties:{}}); }
  if(a.brg!==null){ const db = ((a.brg - trip.smoothBrg + 540) % 360) - 180; trip.smoothBrg += db*(1-Math.exp(-dt*3)); }
  map.jumpTo({ center:a.p, bearing:trip.smoothBrg, pitch: reduced?0:(l.type==='metro'?40:62), zoom: l.type==='metro'?13.6:l.type==='car'?15.4:17 });
}
function toggleSpeed(){ trip.speed = trip.speed===1 ? 5 : 1; document.getElementById('speedBtn').textContent = 'Демо: ×' + trip.speed; }
function stopTrip(){
  trip.on=false; cancelAnimationFrame(trip.raf);
  if(trip.me){ trip.me.remove(); trip.me=null; } if(trip.tip){ trip.tip.remove(); trip.tip=null; }
  trip.speed = 1; trip.smoothBrg = 0; document.getElementById('speedBtn').textContent = 'Демо: ×1';
  document.getElementById('guide').classList.remove('on'); document.getElementById('attrib').classList.remove('guiding');
  const tb = document.getElementById('topbar'); tb.classList.remove('hide'); tb.inert = false; sheet.inert = false;
  if(mapOk) map.getSource('r-me').setData({type:'FeatureCollection',features:[]});
}
function finish(){ stopTrip(); document.getElementById('clock').textContent = fmt(trip.endAt);
  if(state.dest) state.visits[state.dest] = (state.visits[state.dest]||0) + 1;
  state.history=[]; state.view='done'; render('in'); snap('half'); if(mapOk) map.easeTo({pitch:30, zoom:16, bearing:0, duration:reduced?0:900}); }
// «Завершить» — в два нажатия, чтобы случайный тап не обрывал поездку
function endTrip(){
  const b = document.getElementById('stopBtn');
  if(!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'Точно завершить? Нажми ещё раз'; clearTimeout(endTrip._t);
    endTrip._t = setTimeout(()=>{ b.dataset.armed=''; b.textContent='Завершить поездку'; }, 3000); return; }
  clearTimeout(endTrip._t); stopTrip(); document.getElementById('clock').textContent = fmt(NOW);
  state.history = trip.hist || ['home']; state.view='route'; render('back'); snap('half'); fitAll(); toast('Поездка завершена'); }

/* ================= СТАРТ ================= */
for(const id in state.modules) if(!MODULES.some(m => m.id === id)) delete state.modules[id];   // следы удалённых модулей
APP_READY = true;
render(); requestAnimationFrame(()=>snapFor(state.view));
let rsT; window.addEventListener('resize', ()=>{ clearTimeout(rsT); rsT = setTimeout(()=>{ if(!trip.on){ if(sheet.dataset.snap==='place'){ fitSheet(); return; } sheet.classList.remove('anim'); snapY = snaps()[sheet.dataset.snap||'half']; sheet.style.height = snapY+'px'; } }, 150); });
initMap();
</script>
