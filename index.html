<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своя ГИС · живой прототип · Москва</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --violet:#6C6CF0; --violet-btn:#5555DD; --violet-d:#4B4BC8; --lime:#D7F26B;
  --ink:#1A1640; --ink2:#4A4670; --muted:#6B6787; --bg:#F3F2EE; --line:#E1DED6;
  --metro3:#2E6FE6;
  --s1:0 1px 2px rgba(20,17,58,.06),0 4px 14px rgba(20,17,58,.07);
  --s2:0 4px 10px rgba(20,17,58,.18),0 16px 36px rgba(20,17,58,.22);
  --s3:0 -4px 12px rgba(20,17,58,.12),0 -16px 40px rgba(20,17,58,.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E7F7;font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{display:flex;align-items:center;justify-content:center}
button{font-family:inherit}
:focus-visible{outline:3px solid #F2A93B;outline-offset:2px}
.phone{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:var(--violet);box-shadow:0 30px 80px rgba(40,30,120,.35),0 0 0 10px #15123a}
@media (max-width:500px){.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
#map{position:absolute;inset:0}
/* подпись авторов карты — всегда видна */
.attrib{position:absolute;left:16px;top:98px;z-index:19;font-size:10.5px;color:#fff;background:rgba(26,22,64,.55);padding:3px 8px;border-radius:8px;transition:top .3s,bottom .3s}
.attrib a{color:#fff}
.attrib.guiding{top:auto;bottom:178px}
.status{position:absolute;top:0;left:0;right:0;height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:13px;font-weight:600;color:#fff;z-index:30;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.topbar{position:absolute;top:44px;left:14px;right:14px;display:flex;gap:8px;z-index:20;transition:opacity .25s,transform .25s}
.topbar.hide{opacity:0;transform:translateY(-12px);pointer-events:none}
.search{flex:1;height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:var(--s2);font-size:14px;color:var(--ink2);border:0;text-align:left;cursor:pointer}
.search b{color:var(--ink);font-weight:600}
.round{width:48px;height:48px;border-radius:24px;background:#fff;display:grid;place-items:center;box-shadow:var(--s2);border:0;cursor:pointer;color:var(--ink);font-size:18px}
.press{transition:transform .12s ease,box-shadow .12s ease,background .12s}
.press:active{transform:scale(.96);box-shadow:0 1px 3px rgba(20,17,58,.18)!important}
/* шторка */
.sheet{position:absolute;left:0;right:0;bottom:0;height:56%;overflow:hidden;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--s3);z-index:25;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet.anim{transition:height .35s cubic-bezier(.2,.8,.2,1)}
.grab{border:0;background:none;padding:12px 0 6px;display:flex;justify-content:center;cursor:grab;width:100%}
.grab i{width:44px;height:5px;border-radius:3px;background:#8F8BA6}
.body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 40px;touch-action:pan-y;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 36px),transparent)}
.body::-webkit-scrollbar{display:none}
.view.in{animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.view.back{animation:vback .28s ease}
@keyframes vback{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
h1{font-size:20px;font-weight:600;margin:6px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:var(--s1)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:#E7E5F3;border-radius:14px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;height:42px;border:0;border-radius:11px;background:transparent;font-size:14px;color:var(--ink2);cursor:pointer;font-weight:500;transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--s1)}
.tbtn{display:inline-flex;align-items:center;gap:4px;font:inherit;font-weight:600;color:var(--violet-d);background:#EDEDFD;border:0;border-radius:10px;padding:2px 10px;cursor:pointer;vertical-align:baseline}
.tbtn span{font-size:13px}
.seg.sm{margin:0 0 8px}.seg.sm button{height:36px;font-size:13px}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px;margin:14px 0}
.wheel .col{height:220px;width:90px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;box-sizing:border-box;touch-action:pan-y;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent)}
.wheel .col::-webkit-scrollbar{display:none}
.wheel .it{height:44px;line-height:44px;text-align:center;font-size:26px;font-weight:600;scroll-snap-align:center;cursor:pointer;color:var(--ink)}
.wheel .colon{font-size:26px;font-weight:600}
.wheel .lens{position:absolute;left:50%;top:50%;width:220px;height:48px;margin:-24px 0 0 -110px;border-radius:14px;background:rgba(85,85,221,.10);pointer-events:none}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--s1);cursor:pointer;position:relative;border:2px solid transparent;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.card.sel{border-color:var(--violet)}
.card.late{opacity:.75}
.card .top{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.t{font-size:16px;font-weight:600}
.m{font-size:13px;color:var(--muted)}
.right{margin-left:auto;text-align:right;flex:none}
.big{font-size:18px;font-weight:600;white-space:nowrap}
.win{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:26px;padding:3px 10px;border-radius:13px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;background:#F1F0F8;color:var(--ink2)}
.pill.g{background:#E3F5EA;color:#1A6B40}.pill.a{background:#FDF0DA;color:#8A5610}.pill.r{background:#FBE3E1;color:#97291F}
.pill.v{background:#EDEDFD;color:var(--violet-d)}
.rel{display:inline-flex;gap:2px;margin-left:2px}.rel i{width:5px;height:10px;border-radius:2px;background:#CFCCDD}.rel i.f{background:currentColor}
.note{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.btn{height:52px;border-radius:26px;border:0;font-size:16px;font-weight:600;cursor:pointer;width:100%;box-shadow:0 2px 4px rgba(20,17,58,.18),0 6px 14px rgba(20,17,58,.14)}
.btn.p{background:var(--violet-btn);color:#fff;background-image:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%)}
.btn.d{background:var(--ink);color:#fff;background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 60%)}
.btn.w{background:#fff;color:var(--ink)}
.back-btn{border:0;background:none;font-size:22px;color:var(--ink);cursor:pointer;width:44px;height:44px;margin-left:-10px;border-radius:22px}
.steps{position:relative;margin:8px 0 14px}
.st{display:flex;gap:12px;padding:8px 0;position:relative}
.st .dot{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:14px;flex:none;z-index:1;background:#fff;box-shadow:var(--s1)}
.st:not(:last-child)::after{content:"";position:absolute;left:14px;top:38px;bottom:-8px;width:2px;background:#DAD8E8}
.st.metro:not(:last-child)::after{background:var(--metro3)}
.st .tx{flex:1}
.st .tx b{font-weight:600;font-size:15px}
.lm{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#F7F6E8;border:1px dashed #C9C47A;color:#5E5718;border-radius:10px;padding:5px 9px;font-size:12.5px}
.pois{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.poi{flex:none;width:170px;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--s1);cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
.poi .e{font-size:22px}.poi b{display:block;font-size:14px;margin-top:6px}.poi span{font-size:12px;color:var(--muted)}
.toggle{width:46px;height:28px;border-radius:14px;background:#A8A4BD;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.toggle.on{background:var(--violet-btn)}.toggle.on::after{left:21px}
.banner{background:var(--violet-btn);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--s1)}
.banner b{font-size:16px}
.banner.late{background:#97291F}
/* ведение */
.guide{position:absolute;inset:0;z-index:26;pointer-events:none;display:none}
.guide.on{display:block}
.gtop{position:absolute;top:44px;left:12px;right:12px;background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--s2);pointer-events:auto;transition:background .3s}
.gtop .k{font-size:12.5px;opacity:.8}
.gtop .h{font-size:21px;font-weight:600;margin-top:2px;line-height:1.2}
.gtop .lmk{margin-top:8px;font-size:13px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;display:inline-block}
.gtop.alert{background:var(--violet-d)}
.stations{display:flex;gap:4px;margin-top:10px}
.stations i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.25)}
.stations i.f{background:var(--lime)}
.gbot{position:absolute;left:12px;right:12px;bottom:18px;background:#fff;border-radius:22px;padding:14px;box-shadow:var(--s3);pointer-events:auto}
.gbot .row{justify-content:space-between}
.eta{font-size:22px;font-weight:600}
.speed{border:1px solid var(--line);background:#fff;border-radius:20px;height:40px;padding:0 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.me{width:22px;height:22px;border-radius:11px;background:#fff;border:5px solid var(--ink);box-shadow:0 0 0 8px rgba(215,242,107,.45),0 4px 10px rgba(0,0,0,.35)}
.pin{width:max-content;background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:14px;box-shadow:0 2px 4px rgba(20,17,58,.3),0 6px 12px rgba(20,17,58,.18);white-space:nowrap}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#fff}
.pin.dark{background:var(--ink);color:#fff}.pin.dark::after{border-top-color:var(--ink)}
.pin.m3{background:var(--metro3);color:#fff}.pin.m3::after{border-top-color:var(--metro3)}
.pin.poi-pin{background:var(--lime);color:var(--ink)}.pin.poi-pin::after{border-top-color:var(--lime)}
.st-dot{width:12px;height:12px;border-radius:6px;background:#fff;border:3px solid var(--metro3)}
.tip{background:var(--ink);color:#fff;font-size:13px;padding:8px 11px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3);max-width:200px;width:max-content}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(26,22,64,.94);color:#fff;border-radius:18px;padding:16px 20px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:all .25s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px;font-size:14px;z-index:5}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

/* ================= ПРОГНОЗ =================
   Одно правило для всех вариантов:
   • время в пути — симуляция по шагам (P10, медиана, P90 = «самое позднее»);
   • шаги маршрута показывают медиану, их сумма = медиана поездки. */
function rng(seed){ let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const tri = (r, lo, hi) => { const c = 0.35, u = r(); return u < c ? lo + Math.sqrt(u*c)*(hi-lo) : hi - Math.sqrt((1-u)*(1-c))*(hi-lo); };
const legMid = l => Math.round(l.lo + 0.4*(l.hi-l.lo));
const FC = {};
function forecast(k){
  if(FC[k]) return FC[k];
  const o = OPTIONS[k], r = rng(k.length*7919 + k.charCodeAt(0)), N = 4000, s = new Float64Array(N);
  for(let i=0;i<N;i++){ let t=0; for(const l of o.legs) t += tri(r,l.lo,l.hi); if(o.tail[0] && r()<o.tail[0]) t += o.tail[1] + r()*(o.tail[2]-o.tail[1]); s[i]=t; }
  s.sort(); const q = p => s[Math.min(N-1, Math.floor(p*N))];
  const mid = o.legs.reduce((a,l)=>a+legMid(l),0);
  return FC[k] = { p10: Math.round(q(0.1)), p90: Math.ceil(q(0.9)), mid, chance: budget => { let lo=0,hi=N; while(lo<hi){ const m=(lo+hi)>>1; if(s[m]<=budget) lo=m+1; else hi=m; } return lo/N; } };
}
const fmt = m => { m = Math.round(m); const h = Math.floor(m/60)%24, mm = ((m%60)+60)%60; return h + ':' + String(mm).padStart(2,'0'); };
/* Что показываем из прогноза (решение 22.11: «N из 10» неинформативно):
   • главное — во сколько будешь и какой запас;
   • «самое позднее» — 1 поездка из 10 (90-й процентиль), в минутах; у рискованных — с причиной («в пробку — 9:06»);
   • слово-итог цветом: надёжно / есть риск / не успеешь;
   • «выйди до» — крайний срок, чтобы успеть и в плохой день. */
const dep = () => state.timeMode==='depart' ? state.depart : NOW;
const latest = k => state.arrive - forecast(k).p90;
const dur = m => m>=60 ? Math.floor(m/60) + ' ч' + (m%60 ? ' ' + m%60 + ' мин' : '') : m + ' мин';
const isCar = k => k==='taxi' || k==='carshare';
const delayWhy = k => isCar(k) ? 'в пробку' : k==='walk' || k==='loop' ? 'если задержишься' : 'если поезд задержится';
function verdict(k){
  const f = forecast(k), d = dep();
  if(state.timeMode==='depart' || state.mode!=='hurry' || OPTIONS[k].noTarget){
    const spread = f.p90 - f.mid;
    return spread <= 5 ? { cls:'g', word:'стабильно' } : spread <= 10 ? { cls:'a', word: isCar(k) ? 'зависит от пробок' : 'бывает дольше' } : { cls:'r', word:'непредсказуемо' };
  }
  const budget = state.arrive - d;
  if(f.p90 <= budget) return { cls:'g', word:'надёжно', spare: budget - f.mid };
  if(f.mid <= budget) return { cls:'a', word: isCar(k) ? 'риск из-за пробок' : 'есть риск', spare: budget - f.mid, badLate: f.p90 - budget };
  if(f.p10 <= budget) return { cls:'a', likelyLate:true, word:'скорее опоздаешь', late: f.mid - budget };
  return { cls:'r', word:'не успеешь', late: f.mid - budget };
}

const IT = 44;

const glue = h => h.replace(/(\d) (мин|ч|₽|км|м)(?=[\s<.,·)]|$)/g, '$1&nbsp;$2').replace(/≈ /g, '≈&nbsp;');

function go(v){ if(state.view===v) return; state.history.push(state.view); state.view = v; render('in'); if(v==='modules'||v==='time') snap('full'); if(v==='route') snap('half'); }

/* ================= ШТОРКА ================= */
const sheet = document.getElementById('sheet'), phone = document.getElementById('phone');
let snapY = 0;
function snaps(){ const H = phone.clientHeight; return { full: H*0.9, half: H*0.56, peek: 150, hidden: 0 }; }
function snap(name){ sheet.classList.add('anim'); snapY = snaps()[name]; sheet.style.height = snapY + 'px'; sheet.dataset.snap = name;
  document.getElementById('grab').setAttribute('aria-expanded', name==='full'); }
const ORDER = ['peek','half','full'];
document.getElementById('grab').addEventListener('click', e => { if(dragMoved) return; const i = ORDER.indexOf(sheet.dataset.snap); snap(ORDER[(i+1)%3]); });
let dragMoved = false;
(function drag(){
  let sy=0, st=0, dragging=false, lastY=0, lastT=0, v=0, pid=null;
  sheet.addEventListener('pointerdown', e => {
    if(e.button>0) return;
    if(e.target.closest('.wheel')) return;
    if(e.target.closest('.body') && body.scrollTop>0) return;
    dragging=true; dragMoved=false; v=0; sy=e.clientY; st=snapY; lastY=e.clientY; lastT=performance.now(); pid=e.pointerId;
  });
  window.addEventListener('pointermove', e => { if(!dragging || e.pointerId!==pid) return; const dy=e.clientY-sy;
    if(!dragMoved){ if(Math.abs(dy)<6) return; dragMoved=true; sheet.classList.remove('anim'); try{ sheet.setPointerCapture(pid); }catch(_){}}
    snapY = Math.min(phone.clientHeight*0.9, Math.max(110, st-dy)); sheet.style.height = snapY + 'px';
    const now=performance.now(); v=(e.clientY-lastY)/Math.max(1,now-lastT); lastY=e.clientY; lastT=now; });

  // колесо мыши: у верха списка — разворачивает/сворачивает шторку
  let wheelLock = 0;
  sheet.addEventListener('wheel', e => { if(e.target.closest('.wheel')) return; const now = Date.now(); if(now < wheelLock) return;
    const i = ORDER.indexOf(sheet.dataset.snap);

/* ================= КАРТА ================= */
let map, mapOk=false; const markers=[]; const geo={};
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1600); }
function pinEl(text, cls){ const d=document.createElement('div'); d.className='pin '+(cls||''); d.textContent=text; return d; }
function addMarker(el, ll, anchor){ if(!mapOk) return null; const m=new maplibregl.Marker({element:el, anchor:anchor||'bottom'}).setLngLat(ll).addTo(map); markers.push(m); return m; }

function fetchRoute(profile, pts){
  const key = profile + pts.map(p=>p.join(',')).join(';');
  if(geo[key]) return geo[key];
  const base = profile==='foot' ? 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' : 'https://routing.openstreetmap.de/routed-car/route/v1/driving/';
  const p = (async () => {
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 6000);
    try{
      const r = await fetch(base + pts.map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(';') + '?overview=full&geometries=geojson', {signal:ctl.signal});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      if(!(j.routes && j.routes[0])) throw new Error('no route');
      return j.routes[0].geometry.coordinates;
    } catch(e){
      delete geo[key];                        // запасной вариант не кэшируем — попробуем ещё раз позже
      if(!fetchRoute.warned){ fetchRoute.warned = true; toast('Маршрут по улицам не загрузился — показываю схематично'); }

function metroSlice(stations){

  if(l.type==='wait') return Promise.resolve([l.at, l.at]);

function prepLeg(c, l){ const seg=[]; let tot=0; for(let i=1;i<c.length;i++){ const d=dist(c[i-1],c[i]); seg.push(d); tot+=d; }

    if(!mapOk) return;
    const fc = t => ({type:'FeatureCollection', features: routeLegs.filter(x=>x.l.type===t).map(x=>({type:'Feature',geometry:{type:'LineString',coordinates:x.c},properties:{}}))});
    map.getSource('r-walk').setData(fc('walk')); map.getSource('r-metro').setData(fc('metro')); map.getSource('r-car').setData(fc('car'));

    addMarker(pinEl('Дом','dark'), HOME);
    if(!o.noTarget) addMarker(pinEl('Ⓜ Бауманская','m3'), DEST);
    routeLegs.filter(x=>x.l.type==='metro').forEach(x=>x.l.stations.slice(1,-1).forEach(s=>{ const d=document.createElement('div'); d.className='st-dot'; addMarker(d, ST[s], 'center'); }));

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function fitAll(){

}
function flyPoi(i){ const p = OPTIONS[state.sel].pois[i]; snap('peek'); if(mapOk) map.flyTo({center:p.at, zoom:16, pitch:45, duration:reduced?0:900}); toast(p.e+' '+p.n+' · '+p.extra); }

function brand(){
  const layers = map.getStyle().layers;
  const set = (id,k,v) => { try{ map.setPaintProperty(id,k,v); }catch(e){} };
  const hide = id => { try{ map.setLayoutProperty(id,'visibility','none'); }catch(e){} };
  for(const l of layers){
    const id=l.id;
    if(l.type==='background') set(id,'background-color','#6C6CF0');
    else if(l.type==='fill'){
      if(/water/.test(id)) set(id,'fill-color','#8C8DF5');
      else if(/park|wood|grass|landcover|forest|garden/.test(id)) { set(id,'fill-color','#6464E6'); set(id,'fill-opacity',0.8); }
      else if(/building/.test(id)) set(id,'fill-color','#7B7CF2');
      else { set(id,'fill-color','#6E6EF0'); set(id,'fill-opacity',0.5); }
    }
    else if(l.type==='line'){
      if(/water|river/.test(id)) set(id,'line-color','#8C8DF5');
      else if(/boundary|admin/.test(id)) hide(id);
      else if(/rail|transit/.test(id)) set(id,'line-color','#5A5AD8');
      else if(/casing/.test(id)) set(id,'line-color','#5F5FE0');
      else if(/motorway|trunk|primary|secondary/.test(id)) { set(id,'line-color','#D7F26B'); set(id,'line-opacity',0.75); }
      else if(/road|street|minor|service|path|pedestrian|tertiary|highway|bridge|tunnel/.test(id)) set(id,'line-color','#9FA0F7');
    }
    else if(l.type==='fill-extrusion'){ set(id,'fill-extrusion-color','#8384F4'); set(id,'fill-extrusion-opacity',0.9); }
    else if(l.type==='symbol'){
      if(/poi/.test(id)) hide(id);
      else { set(id,'text-color','#FFFFFF'); set(id,'text-halo-color','#3E3EB8'); set(id,'text-halo-width',1.6); }
    }
  }
}
function addRouteLayers(){
  const empty = {type:'FeatureCollection',features:[]};
  ['r-walk','r-metro','r-car','r-me'].forEach(s=>map.addSource(s,{type:'geojson',data:empty}));
  const lay = {'line-cap':'round','line-join':'round'};
  map.addLayer({id:'car-shadow',type:'line',source:'r-car',layout:lay,paint:{'line-color':'#14113A','line-width':13,'line-opacity':0.35,'line-blur':6,'line-translate':[0,3]}});
  map.addLayer({id:'metro-shadow',type:'line',source:'r-metro',layout:lay,paint:{'line-color':'#14113A','line-width':13,'line-opacity':0.35,'line-blur':6,'line-translate':[0,3]}});
  map.addLayer({id:'car-case',type:'line',source:'r-car',layout:lay,paint:{'line-color':'#14113A','line-width':10}});
  map.addLayer({id:'car',type:'line',source:'r-car',layout:lay,paint:{'line-color':'#FFFFFF','line-width':6}});
  map.addLayer({id:'metro-case',type:'line',source:'r-metro',layout:lay,paint:{'line-color':'#FFFFFF','line-width':10}});
  map.addLayer({id:'metro',type:'line',source:'r-metro',layout:lay,paint:{'line-color':'#2E6FE6','line-width':6}});
  map.addLayer({id:'walk-case',type:'line',source:'r-walk',layout:lay,paint:{'line-color':'#14113A','line-width':8,'line-opacity':0.5}});
  map.addLayer({id:'walk',type:'line',source:'r-walk',layout:lay,paint:{'line-color':'#FFFFFF','line-width':4,'line-dasharray':[0.1,2]}});
  map.addLayer({id:'passed',type:'line',source:'r-me',layout:lay,paint:{'line-color':'#D7F26B','line-width':6}});
}
function showFallback(){ document.getElementById('fallback').style.display='flex'; }
function initMap(){
  if(!window.maplibregl){ showFallback(); return; }
  try{
    map = new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/liberty', center:[37.74,55.785], zoom:12.3, attributionControl:false });
  }catch(e){ showFallback(); return; }                 // нет WebGL
  const loadTimer = setTimeout(()=>{ if(!mapOk) showFallback(); }, 15000);
  map.on('load', () => {
    clearTimeout(loadTimer); mapOk = true; document.getElementById('fallback').style.display='none';
    brand(); addRouteLayers();
    showRoute(state.sel).then(fitAll);
  });
}

/* ================= ВЕДЕНИЕ ================= */
const dist = (a,b) => { const R=6371000, toR=Math.PI/180, dLat=(b[1]-a[1])*toR, dLon=(b[0]-a[0])*toR; const x=Math.sin(dLat/2)**2+Math.cos(a[1]*toR)*Math.cos(b[1]*toR)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const bearing = (a,b) => { const toR=Math.PI/180, y=Math.sin((b[0]-a[0])*toR)*Math.cos(b[1]*toR), x=Math.cos(a[1]*toR)*Math.sin(b[1]*toR)-Math.sin(a[1]*toR)*Math.cos(b[1]*toR)*Math.cos((b[0]-a[0])*toR); return Math.atan2(y,x)/toR; };
function along(L, f){
  const c = L.c, seg = L.seg; let t = f*L.tot;
  for(let i=0;i<seg.length;i++){ if(t<=seg[i]||i===seg.length-1){ const k=seg[i]?Math.min(1,t/seg[i]):0; const a=c[i], b=c[i+1];
    const p=[a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k]; return { p, brg: seg[i]?bearing(a,b):null, passed:c.slice(0,i+1).concat([p]) }; } t-=seg[i]; }
  return { p:c[c.length-1], brg:null, passed:c };
}
const trip = { on:false, t:0, speed:1, raf:0, me:null, tip:null, buzzed:false, lastLeg:-1, smoothBrg:0, lastSet:0, lastHtml:'', total:0, endAt:0 };
const SIM_SECONDS_PER_MIN = 2.2;   // ×1: минута пути ≈ 2 секунды
async function startTrip(){
  if(trip.on) return;
  trip.on = true;                                       // защита от двойного нажатия
  const btn = document.getElementById('goBtn'); if(btn){ btn.disabled = true; btn.textContent = 'Строю маршрут…'; }
  await routeReady;
  if(routeKey !== state.sel) await showRoute(state.sel);
  const o = OPTIONS[state.sel];
  if(state.sel==='taxi' || state.sel==='carshare') toast(state.sel==='taxi' ? 'Машина найдена · подача ~5 мин' : 'Машина забронирована · 20 мин бесплатно');
  document.getElementById('topbar').classList.add('hide'); document.getElementById('topbar').inert = true;
  sheet.inert = true; snap('hidden'); document.getElementById('guide').classList.add('on');
  document.getElementById('attrib').classList.add('guiding');
  Object.assign(trip, { t:0, buzzed:false, lastLeg:-1, smoothBrg: mapOk ? map.getBearing() : 0, lastSet:0, lastHtml:'' });
  trip.total = o.legs.reduce((s,l)=>s+legMid(l),0); trip.startAt = dep(); trip.endAt = trip.startAt + trip.total;
  document.getElementById('geta').textContent = fmt(trip.endAt);
  let last = performance.now();
  const tick = now => { if(!trip.on) return;
    const dt = Math.min(0.1, (now-last)/1000); last = now;   // после фоновой вкладки не перескакиваем
    trip.t += dt/SIM_SECONDS_PER_MIN*trip.speed; update(dt);
    if(trip.t>=trip.total){ finish(); return; } trip.raf=requestAnimationFrame(tick); };
  trip.raf = requestAnimationFrame(tick);
}
function update(dt){
  const o = OPTIONS[state.sel]; let acc=0, li=0;
  for(; li<o.legs.length-1; li++){ const m = legMid(o.legs[li]); if(trip.t < acc+m) break; acc+=m; }
  const l = o.legs[li], lm = legMid(l), f = Math.min(1,(trip.t-acc)/lm), leg = routeLegs[li];
  const left = Math.max(0, Math.ceil(trip.total-trip.t));
  document.getElementById('clock').textContent = fmt(trip.startAt + trip.t);
  document.getElementById('gleft').textContent = left ? 'ещё ' + left + ' мин' : 'почти на месте';
  let html, alert=false;
  if(l.type==='metro'){
    const n = l.stations.length-1, fr = leg && leg.stFrac, passed = fr ? fr.filter((x,i)=>i>0 && x<=f+1e-6).length : Math.min(n, Math.floor(f*n+1e-4)), rest = n - passed;
    const next = l.stations[Math.min(n, passed+1)], lastSt = l.stations[n];
    if(rest<=1 && !trip.buzzed){ trip.buzzed=true; try{ navigator.vibrate && navigator.vibrate([120,80,120]); }catch(e){}
      if(!reduced){ phone.classList.add('shake'); setTimeout(()=>phone.classList.remove('shake'),500); } say('Следующая — ' + lastSt + ', выходи'); }
    alert = rest<=1;
    html = `<div class="k">Метро · следующая ${next}</div><div class="h">${rest<=1 ? 'Следующая — ' + lastSt + ', выходи' : 'Выходить через ' + stops(rest)}</div>
      <div class="stations" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i<passed?'f':''}"></i>`).join('')}</div>${l.lm?`<div class="lmk">📍 ${l.lm}</div>`:''}`;
  } else {
    const mleft = Math.max(1, Math.ceil(lm*(1-f)));
    const kind = l.type==='walk'?'Пешком':l.type==='wait'?'Подожди':'В пути';
    html = `<div class="k">${kind} · ${mleft} мин</div><div class="h">${l.label}</div>${l.lm?`<div class="lmk">📍 ${l.lm}</div>`:''}`;
  }
  if(html !== trip.lastHtml){ const g = document.getElementById('gtop'); g.className = 'gtop' + (alert?' alert':''); g.innerHTML = html; trip.lastHtml = html; }
  if(trip.lastLeg!==li){ trip.lastLeg=li; say(l.label);
    if(mapOk){ if(trip.tip){ trip.tip.remove(); trip.tip=null; }
      if(l.tip && leg){ const d=document.createElement('div'); d.className='tip'; d.textContent=l.tip; trip.tip = new maplibregl.Marker({element:d, anchor:'bottom', offset:[0,-14]}).setLngLat(leg.c[leg.c.length-1]).addTo(map); } } }
  if(!mapOk || !leg) return;
  if(!trip.me){ const el=document.createElement('div'); el.className='me'; trip.me = new maplibregl.Marker({element:el}).setLngLat(leg.c[0]).addTo(map); }
  const a = along(leg, f);
  trip.me.setLngLat(a.p);
  const now = performance.now();
  if(now - trip.lastSet > 200){ trip.lastSet = now;     // пройденная линия — 5 раз в секунду
    const passedCoords = routeLegs.slice(0,li).flatMap(x=>x.c).concat(a.passed);
    map.getSource('r-me').setData({type:'Feature',geometry:{type:'LineString',coordinates:passedCoords.length>1?passedCoords:[a.p,a.p]},properties:{}}); }
  if(a.brg!==null){ const db = ((a.brg - trip.smoothBrg + 540) % 360) - 180; trip.smoothBrg += db*(1-Math.exp(-dt*3)); }
  map.jumpTo({ center:a.p, bearing:trip.smoothBrg, pitch: reduced?0:(l.type==='metro'?40:62), zoom: l.type==='metro'?13.6:l.type==='car'?15.4:17 });
}
function toggleSpeed(){ trip.speed = trip.speed===1 ? 5 : 1; document.getElementById('speedBtn').textContent = 'Перемотка ×' + trip.speed; }
function stopTrip(){
  trip.on=false; cancelAnimationFrame(trip.raf);
  if(trip.me){ trip.me.remove(); trip.me=null; } if(trip.tip){ trip.tip.remove(); trip.tip=null; }
  trip.speed = 1; trip.smoothBrg = 0; document.getElementById('speedBtn').textContent = 'Перемотка ×1';
  document.getElementById('clock').textContent = fmt(NOW);
  document.getElementById('guide').classList.remove('on'); document.getElementById('attrib').classList.remove('guiding');
  const tb = document.getElementById('topbar'); tb.classList.remove('hide'); tb.inert = false; sheet.inert = false;
  if(mapOk) map.getSource('r-me').setData({type:'FeatureCollection',features:[]});
}
function finish(){ stopTrip(); state.history=[]; state.view='done'; render('in'); snap('half'); if(mapOk) map.easeTo({pitch:30, zoom:16, bearing:0, duration:reduced?0:900}); }
function endTrip(){ stopTrip(); state.view='route'; render('back'); snap('half'); fitAll(); toast('Поездка завершена'); }

/* ================= СТАРТ ================= */
render(); requestAnimationFrame(()=>snap('half'));
let rsT; window.addEventListener('resize', ()=>{ clearTimeout(rsT); rsT = setTimeout(()=>{ if(!trip.on){ sheet.classList.remove('anim'); snapY = snaps()[sheet.dataset.snap||'half']; sheet.style.height = snapY+'px'; } }, 150); });
showRoute(state.sel);
initMap();
</script>
